<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>视频剪辑 SOP 工作台</title>
<style>
:root{--bg:#0e1014;--side:#12151b;--card:#171b22;--card2:#1d222b;--line:#272c36;--text:#e8eaef;--dim:#8a91a0;--gold:#f5c518;--ok:#3ecf8e;--bad:#ff6b6b;--blue:#5aa9ff}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,"PingFang SC","Helvetica Neue",sans-serif;display:flex}
a{color:var(--blue);cursor:pointer}button{font:inherit}
aside{width:230px;flex:none;overflow-y:auto;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px}
aside h1{font-size:16px;margin:0 8px 22px}aside h1 b{color:var(--gold)}
.nav{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--dim);padding:9px 12px;border-radius:9px;cursor:pointer;text-align:left;font-size:14px}
.nav:hover{background:#1a1e26}.nav.on{background:#20252f;color:var(--text)}
.badge{margin-left:auto;min-width:20px;padding:0 6px;border-radius:10px;background:var(--gold);color:#000;font-size:12px;line-height:20px;text-align:center;font-weight:600}
.badge.red{background:var(--bad);color:#fff}
aside .foot{margin-top:auto;color:var(--dim);font-size:12px;padding:0 8px;word-break:break-all}
.set{margin-bottom:10px}.set label{display:block;margin-bottom:4px}.set select{width:100%;background:#0b0d11;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px}
.set .hint{font-size:11px;margin-top:3px}
.live{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--card);font-size:12px;line-height:1.55}
.live .hd{display:flex;align-items:center;gap:7px;color:var(--text);font-size:13px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:#59606e;display:inline-block}.dot.busy{background:var(--ok);box-shadow:0 0 0 0 #3ecf8e88;animation:pulse 1.6s infinite}
.dot.off{background:#59606e}.dot.idle{background:var(--blue)}@keyframes pulse{70%{box-shadow:0 0 0 7px #3ecf8e00}100%{box-shadow:0 0 0 0 #3ecf8e00}}
.live .st{margin-top:6px;color:var(--dim)}.live .st b{color:var(--text);font-weight:500}.live .ls{margin-top:3px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.auto{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.sw{position:relative;width:36px;height:20px;flex:none;border-radius:10px;background:#333a46;cursor:pointer;border:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}.sw.on{background:var(--ok)}.sw.on::after{left:18px}
main{flex:1;overflow:auto;padding:22px 26px 80px;min-width:0}
.wrap{max-width:1500px;margin:0 auto}.wrap.wide{max-width:none}
h2{font-size:20px;margin:0 0 4px}h3{font-size:15px;margin:0 0 10px}.sub{color:var(--dim);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.dim{color:var(--dim);font-size:13px}.grid{display:grid;gap:14px}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--text);padding:7px 14px;border-radius:9px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:#3b4250}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--gold);color:#111;border-color:var(--gold);font-weight:600}.btn.bad{color:var(--bad)}.btn.sm{padding:4px 10px;font-size:12px}.btn.xs{padding:2px 8px;font-size:11.5px;border-radius:7px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:1px 9px;border-radius:20px;font-size:12px;background:#232833;color:var(--dim);white-space:nowrap}
.pill.me{background:#3a3112;color:var(--gold)}.pill.ok{background:#123326;color:var(--ok)}.pill.bad,.pill.err{background:#3a1717;color:var(--bad)}.pill.ai,.pill.run,.pill.queue{background:#14263b;color:var(--blue)}.pill.re{background:#2c1f3d;color:#c59bff}
.folders{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.folder{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.folder .ic{font-size:26px;line-height:1}.folder b{font-size:15px}.folder .cnt{color:var(--gold);font-weight:600}
/* 顶部:等你处理 */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.topbar h2{margin:0;margin-right:6px}
.inbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:14px}
.inbox .lab{font-weight:600;font-size:13px;margin-right:4px;white-space:nowrap}
.chip{display:inline-flex;gap:6px;align-items:center;max-width:300px;background:#20252f;border:1px solid var(--line);border-radius:20px;padding:3px 11px;font-size:12.5px;cursor:pointer}
.chip:hover{border-color:var(--gold)}.chip.err{border-color:#5a2525;color:#ffb4b4}.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip b{color:var(--gold);font-weight:600;flex:none}.chip.err b{color:var(--bad)}
/* 看板 */
.board{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:1 0 210px;max-width:290px;background:var(--side);border:1px solid var(--line);border-radius:12px;padding:8px}
.col.empty{flex:0 0 64px;padding:8px 4px;opacity:.75}
.col h4{margin:2px 4px 8px;font-size:13px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.col h4 .who{font-size:11px;color:var(--dim);font-weight:400;margin-left:auto}
.col.empty h4{flex-direction:column;gap:1px;align-items:center;white-space:normal;text-align:center;font-size:11.5px;line-height:1.3;margin:2px 0}
.col.empty h4 .who{margin:0}
.col.me h4 .nm{color:var(--gold)}
.vc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:7px;cursor:pointer;position:relative;font-size:12.5px}
.vc:hover{border-color:#3b4250}.vc.me{border-left:3px solid var(--gold)}.vc.err{border-color:#6b2a2a;border-left:3px solid var(--bad);background:#1e1517}
.vc.run{border-left:3px solid var(--ok)}.vc.flash{animation:flash 2.4s}@keyframes flash{0%,40%{box-shadow:0 0 0 2px var(--gold)}100%{box-shadow:0 0 0 0 transparent}}
.vc .tt{font-weight:600;font-size:13px;line-height:1.45;margin-bottom:5px;padding-right:20px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vc .kind{font-size:11px;color:var(--dim);margin-bottom:3px}
.vc .ck{position:absolute;right:8px;top:9px;width:16px;height:16px;accent-color:var(--gold)}
.vc .row{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:4px}
.vc .nx{margin-top:5px;color:var(--dim);font-size:11.5px;line-height:1.45}
.vc .why{margin-top:5px;color:#ffb4b4;font-size:11.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vc .re{margin-top:5px;color:#c59bff;font-size:11.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vc .warn{margin-top:4px;color:#f0b35a;font-size:11.5px}
.vc .btns{margin-top:7px;gap:5px}
.plats{display:flex;gap:3px;flex-wrap:wrap}.pf{font-size:11px;padding:0 6px;border-radius:6px;background:#232833;color:var(--dim);line-height:18px;white-space:nowrap}
.pf.ok{background:#123326;color:var(--ok)}.pf.err{background:#3a1717;color:var(--bad)}.pf.ai{background:#14263b;color:var(--blue)}.pf.me{background:#3a3112;color:var(--gold)}.pf.off{opacity:.45;text-decoration:line-through}
.offzone{margin-top:8px}.offzone .list{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.offzone .vc{width:230px;opacity:.75}
.empty{color:var(--dim);text-align:center;padding:14px 6px;font-size:13px}
.bulk{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f242d;border:1px solid var(--gold);border-radius:12px;padding:10px 16px;display:none;gap:10px;align-items:center;z-index:20;box-shadow:0 8px 30px #0008}
/* 抽屉 */
#mask{position:fixed;inset:0;background:#0009;display:none;z-index:30}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(780px,96vw);background:var(--bg);border-left:1px solid var(--line);z-index:31;transform:translateX(100%);transition:transform .2s;overflow:auto;padding:22px 26px 60px}
#drawer.open{transform:none}
.dh{display:flex;gap:10px;align-items:flex-start;margin-bottom:16px}.dh h2{flex:1;font-size:18px}
.next{background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:16px;margin-bottom:16px}.next.ai{border-color:#2a4466}.next.err{border-color:var(--bad);background:#1e1517}
.next .lead{font-weight:700;margin-bottom:10px;font-size:15px}
.quote{border-left:3px solid #c59bff;background:#1d1828;padding:8px 12px;border-radius:0 9px 9px 0;margin:8px 0;font-size:13px;white-space:pre-wrap}
.quote.req{border-color:var(--gold);background:#221e10}.quote.warn{border-color:#f0b35a;background:#231c10}
video{width:100%;background:#000;border-radius:10px;max-height:430px}.v916{max-width:300px}
.covers{display:flex;gap:12px;flex-wrap:wrap}.cov{text-align:center;cursor:pointer}.cov img{height:210px;border-radius:10px;border:3px solid transparent;display:block}
.cov.sel img{border-color:var(--gold)}.cov .dim{margin-top:4px}.cov.small img{height:110px}
label.f{display:block;font-size:13px;color:var(--dim);margin:12px 0 5px}
input,textarea{width:100%;background:#0b0d11;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 11px;font:inherit}textarea{min-height:72px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
input[type=checkbox]{width:auto}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.tag{border:1px solid var(--line);background:#1a1e26;color:var(--dim);border-radius:16px;padding:2px 10px;font-size:12px;cursor:pointer;user-select:none}
.tag.on{border-color:var(--gold);color:var(--gold);background:#2a2410}
.drop{border:1.5px dashed #3b4250;border-radius:12px;padding:14px;text-align:center;color:var(--dim);font-size:13px;cursor:pointer;margin-top:8px}.drop.over{border-color:var(--gold);color:var(--gold)}
.cand{display:flex;gap:8px;align-items:center;margin:4px 0;font-size:13px}.cand .txt{flex:1}
details{margin-top:10px}summary{cursor:pointer;color:var(--dim);font-size:13px}
.md{white-space:pre-wrap;font-size:13.5px;line-height:1.7;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;max-height:70vh;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--dim);font-weight:500;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.seg button{background:none;border:0;color:var(--dim);padding:4px 12px;cursor:pointer;font-size:12.5px}.seg button.on{background:#262c37;color:var(--text)}
.plat-sec{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px;background:#12151b}
.plat-sec h4{margin:0 0 4px;display:flex;align-items:center;gap:8px;font-size:14px}
.bar{height:7px;border-radius:4px;background:#232833;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--gold)}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50}
#modal .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(480px,92vw)}
#modal h3{font-size:17px}#modal .btns{justify-content:flex-end;margin-top:18px}
#toast{position:fixed;right:22px;bottom:22px;max-width:440px;background:#1f242d;border:1px solid var(--line);padding:12px 16px;border-radius:12px;display:none;white-space:pre-wrap;z-index:60;font-size:13px}
.help{background:#14202e;border:1px solid #23405e;border-radius:12px;padding:12px 14px;font-size:13px;color:#b9cde3;margin-bottom:16px}
</style>
</head>
<body>
<aside>
  <h1>视频剪辑 SOP <b>工作台</b></h1>
  <button class="nav" data-p="board">🧭 工作台<span class="badge" id="b-board" style="display:none"></span></button>
  <button class="nav" data-p="sources">🎙 录像与复盘</button>
  <button class="nav" data-p="data">📊 数据</button>
  <button class="nav" data-p="prefs">🧠 我的偏好</button>
  <button class="nav" data-p="folders">📁 文件夹</button>
  <div class="foot"><div id="live"></div><div id="auto"></div><div id="gates"></div><div id="settings"></div><div id="proj" style="margin-top:12px"></div><button class="btn sm" style="margin-top:8px" onclick="load(true)">刷新</button></div>
</aside>
<main><div class="wrap" id="main"><div class="empty">加载中…</div></div></main>
<div id="mask" onclick="closeDrawer()"></div>
<div id="drawer"></div>
<div class="bulk" id="bulk"></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<script>
const PAGES=["board","sources","data","prefs","folders"];
const hashPage=()=>{const h=location.hash.slice(1);return PAGES.includes(h)?h:"board"};
let S=null,page=hashPage(),openId=null,openKind=null,picked=new Set(),coverSel={},dirty={},flashId=null,tagSel={},dataTier="72h",dataPlat="",showAllTodo=false,pubSel={};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const file=p=>"/file?path="+encodeURIComponent(p);
const hm=t=>(t||"").slice(5,16).replace("T"," ");
const fmt=(v,pct)=>v==null?"–":pct?(v*100).toFixed(1)+"%":v>=10000?(v/10000).toFixed(2)+"万":Math.round(v);
const dur=s=>s<60?s+" 秒":s<3600?Math.floor(s/60)+" 分钟":Math.floor(s/3600)+" 小时 "+Math.floor(s%3600/60)+" 分";
function toast(t,ok=true){const e=$("#toast");e.textContent=t;e.style.borderColor=ok?"var(--ok)":"var(--bad)";e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",ok?2600:7000)}
function modal(title,body,okText,onOk,danger){$("#mbox").innerHTML=`<h3>${esc(title)}</h3><div class="dim" style="font-size:14px;line-height:1.8">${body}</div><div class="btns"><button class="btn" onclick="closeModal()">取消</button><button class="btn ${danger?"bad":"pri"}" id="mok">${esc(okText)}</button></div>`;$("#modal").style.display="flex";$("#mok").onclick=()=>{closeModal();onOk()}}
function closeModal(){$("#modal").style.display="none"}
async function load(manual){try{const r=await fetch("/api/state");S=await r.json();if(S.错误)throw new Error(S.错误);render();if(openId)renderDrawer();if(manual)toast("已刷新")}catch(e){$("#main").innerHTML=`<div class="card">读取失败:${esc(e.message)}</div>`}}
async function post(body){try{const r=await fetch("/api/action",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});return await r.json()}catch(e){return {成功:false,错误:"连不上工作台服务"}}}
async function act(body,msg,noReload){const j=await post(body);if(j.成功)toast("✅ "+(msg||j.输出||"已完成"));else toast("❌ "+(j.输出||j.错误||"失败"),false);if(!noReload&&!["打开","打开平台"].includes(body.动作))await load();return j.成功}
const openFolder=k=>act({动作:"打开",文件夹:k},"已在访达打开");
const reveal=p=>act({动作:"打开",路径:p},"已在访达打开");
const openPlat=(plat,which)=>act({动作:"打开平台",平台:plat,页面:which});

/* ================= 把录像、片段、各平台发布排进 12 列 ================= */
const COLS=[["inbox","📥","收件","ai"],["sort","🗂","整理","ai"],["recap","🎧","速记复盘","ai"],["pick","👤","挑片段","me"],["cut","✂️","剪辑","ai"],["review","👤","看成片","me"],
  ["copy","✍️","写文案","ai"],["cover","🎨","做封面","ai"],["coverpick","👤","选封面","me"],["auth","👤","确认发布","me"],["pub","⏰","定时发布","ai"],["data","📊","数据复盘","ai"]];
const CI=Object.fromEntries(COLS.map((c,i)=>[c[0],i]));
const GATE={pick:"挑选",review:"看片",coverpick:"选封面",auth:"确认发布"};
const ME_DO={pick:"挑一下要不要剪",review:"看成片,通过或打回",coverpick:"选一张封面",auth:"确认文案和封面,授权定时发布"};
const AB={抖音:"抖",视频号:"视",小红书:"红",B站:"B"};
const PIC={草稿:"✎",待发布:"⏳",已定时:"⏰",已发布:"✅",需人工:"⚠️",已废弃:"✕",已撤回:"↩"};
const gateOn=col=>GATE[col]&&(S.配置.AI代审||{})[GATE[col]];
const pubsOf=cid=>S.发布.filter(p=>p.clip_id===cid).sort((a,b)=>(S.配置.发布平台||[]).indexOf(a.平台)-(S.配置.发布平台||[]).indexOf(b.平台));
const activePubs=ps=>ps.filter(p=>!["已废弃","已撤回"].includes(p.状态));
function pubCol(p,k){
  if(p.状态==="需人工"){const b=p.之前;return b==="待发布"||b==="已定时"?"pub":b==="已发布"?"data":"auth"}
  if(p.状态==="草稿"){if(!p.封面竖文件)return (k.封面候选||[]).length?"coverpick":"cover";if(!p.封面横文件)return "cover";return "auth"}
  if(p.状态==="待发布"||p.状态==="已定时")return "pub";
  if(p.状态==="已发布")return "data";return null}
function clipCol(k,ps){
  const b=k.之前;
  if(k.状态==="候选")return "pick";if(k.状态==="放弃")return "off";
  if(k.状态==="待剪"||k.状态==="剪辑中")return "cut";if(k.状态==="已剪辑")return "review";
  if(k.状态==="需人工")return b==="候选"?"pick":b==="已剪辑"?"review":"cut";
  const act=activePubs(ps);
  if(ps.length&&!act.length)return "off";
  const plats=S.配置.发布平台||[];
  if(!act.length||plats.some(pl=>!ps.some(p=>p.平台===pl)))return "copy";
  return act.map(p=>pubCol(p,k)).filter(Boolean).sort((a,b)=>CI[a]-CI[b])[0]||"data"}
function running(ids){return !!(L&&L.在干活&&(L.对象||[]).some(o=>ids.includes(o)))}
function lastFail(objs){for(const o of objs){const r=(o.监测||{}).最近结果;if(r&&["失败","卡权限"].includes(r.结果))return r}return null}
function coolOf(objs){for(const o of objs){const c=(o.监测||{}).冷却;if(c)return c}return null}
function items(){
  const out=[];
  for(const f of S.收件||[]){const col=f.状态==="整理中"?"sort":"inbox";
    out.push({type:"file",id:"file:"+f.文件,ids:[f.文件],title:f.文件,col,f,
      state:col==="sort"?"run":f.状态==="还在写入"?"wait":"queue",
      label:col==="sort"?"整理中":f.状态==="还在写入"?"还在写入":"排队整理"})}
  for(const s of S.素材){const n=S.切片.filter(k=>k.source_id===s.source_id).length;let col;
    if(s.状态==="待整理")col="sort";else if(s.状态==="已整理")col="recap";
    else if(s.状态==="需人工")col=s.之前==="待整理"?"sort":"recap";
    else if(s.状态==="已复盘"&&!n)col="recap";else continue;
    const err=s.状态==="需人工",run=running([s.source_id]);
    out.push({type:"source",id:s.source_id,ids:[s.source_id],title:s.标题||s.source_id,col,s,objs:[s],
      state:err?"err":run?"run":s.状态==="已复盘"?"done":"queue",
      label:err?"出错了":run?(col==="sort"?"整理中":"转写复盘中"):s.状态==="已复盘"?"没挑出可剪的片段":col==="sort"?"排队整理":"排队转写复盘"})}
  for(const k of S.切片){const ps=pubsOf(k.clip_id),col=clipCol(k,ps),ids=[k.clip_id,...ps.map(p=>p.publish_id)];
    const objs=[k,...ps],errP=ps.filter(p=>p.状态==="需人工"),err=k.状态==="需人工"||errP.length>0,run=running(ids);
    const me=COLS[CI[col]]&&COLS[CI[col]][3]==="me"&&!gateOn(col);
    let label;
    if(col==="off")label=k.状态==="放弃"?"不剪了":"决定不发";
    else if(err)label="出错了";
    else if(me)label="等你";
    else if(gateOn(col))label="AI 代审中";
    else if(run)label="进行中";
    else if(col==="pub"){const t=activePubs(ps).filter(p=>p.状态==="已定时").map(p=>p.发布时间).sort()[0];label=activePubs(ps).some(p=>p.状态==="待发布")?"排队设定时":t?"已定时 "+hm(t):"已定时"}
    else if(col==="data")label="已发布";
    else label="排队中";
    out.push({type:"clip",id:k.clip_id,ids,title:k.标题,col,k,ps,objs,errP,
      state:col==="off"?"off":err?"err":me?"me":run?"run":["pub","data"].includes(col)&&!activePubs(ps).some(p=>p.状态==="待发布")?"ok":"queue",label})}
  return out}
const mineItems=()=>items().filter(x=>x.state==="me"||x.state==="err");

/* "下一步:谁、大约何时" */
function nextText(x){
  const cool=x.objs&&coolOf(x.objs);
  if(x.state==="me")return "👤 下一步:你 — "+ME_DO[x.col];
  if(x.state==="err")return "👤 下一步:你 — 看原因,点下面的按钮继续";
  if(x.state==="off")return "";
  if(x.state==="done")return "复盘写好了,这场没有挑出能剪的片段(点开看复盘)";
  if(x.type==="file"&&x.f.状态==="还在写入")return `录像还在写入,约 ${dur(Math.max(60,x.f.可开始秒))}后开始整理`;
  if(x.state==="run"){const sec=L&&L.开始?Math.max(0,Math.round((Date.now()-new Date(L.开始))/1000)):0;return `🤖 AI 正在做 · 已 ${dur(sec)}`}
  if(x.col==="pub"&&x.state==="ok"){const t=activePubs(x.ps).filter(p=>p.状态==="已定时").map(p=>p.发布时间).sort()[0];return `⏰ ${hm(t)} 平台自动发出;到点后 AI 去后台核对、回填链接`}
  if(x.col==="data"){const t=nextMetric(x.ps);return t?`📊 约 ${t.at} 采集 ${t.tier} 数据`:"✅ 24h/72h/7d 数据都采完了"}
  if(cool)return `🤖 上次失败,约 ${cool.重试时间} 自动重试`;
  if(!(S.自动处理||{}).开启)return "🤖 自动处理已关,AI 不会开工(左下角打开)";
  const nu=L&&L.下一步;
  if(nu&&(nu.对象||[]).some(o=>x.ids.includes(o))){
    if(L.在干活)return "🤖 下一个就做它 · 等手上这步做完";
    const n=L.下次检查秒;return "🤖 下一个就做它 · "+(n>0?`约 ${dur(n)}后开始`:"马上开始")}
  return "🤖 排队中 · 前面的做完就轮到"}
function nextMetric(ps){let best=null;
  for(const p of activePubs(ps)){if(p.状态!=="已发布"||!p.发布时间)continue;const t0=new Date(p.发布时间).getTime();
    for(const [tier,h] of [["24h",24],["72h",72],["7d",168]]){if(!(p.数据||{})[tier]){const at=t0+h*3600e3;if(!best||at<best.t)best={t:at,tier};break}}}
  if(!best)return null;const d=new Date(best.t);
  return {tier:best.tier,at:best.t<Date.now()?"现在":`${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}}

const RESUME={source:{待整理:"重新整理",已整理:"重试转写复盘",已复盘:"我处理好了,继续"},
  clip:{待剪:"让 AI 重剪",已剪辑:"我处理好了,去看片",候选:"退回候选",放弃:"不剪了"},

function resumeOpts(kind,obj){const b=obj.之前;const all=RESUME[kind];let first;
  if(kind==="source")first=b==="待整理"?"待整理":"已整理";
  else if(kind==="clip")first=b==="已剪辑"?"已剪辑":b==="候选"?"候选":"待剪";
  else first=b==="已定时"?"已定时":b==="草稿"?"草稿":"待发布";
  return [first,...Object.keys(all).filter(k=>k!==first)].map(to=>({to,t:all[to]}))}
const resumeBtn=(kind,id,to,t,cls="")=>`<button class="btn xs ${cls}" onclick="event.stopPropagation();resume('${kind}','${esc(id)}','${to}')">${esc(t)}</button>`;

function platBadge(p){const st=p.状态,c=st==="需人工"?"err":st==="已发布"||st==="已定时"?"ok":st==="待发布"?"ai":st==="草稿"?"me":"off";

   <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${Object.entries(S.分组).map(([dim,rs])=>`<div><b>${esc(dim)}</b>${rs.length?`<table><tr><th>分组</th><th>条</th><th>播放</th><th>完播</th></tr>${rs.map(r=>`<tr><td>${esc(r.分组)}</td><td>${r.条数}</td><td>${fmt(r.平均播放)}</td><td>${fmt(r.平均完播率,1)}</td></tr>`).join("")}</table>`:'<div class="dim">暂无</div>'}</div>`).join("")}</div></div>`}
