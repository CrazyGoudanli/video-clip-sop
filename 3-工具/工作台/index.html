function renderOverviewListOnly() {
  const b = $("#ov-list-body");
  if (b) b.innerHTML = renderOverviewGroups();
}

function renderOverviewGroups() {
  const q = ovSearch.trim().toLowerCase();
  const match = (id, title, sub) => !q || `${id} ${title} ${sub}`.toLowerCase().includes(q);
  const all = items();
  const rows = [];

  for (const x of all) {
    if (x.type === "file") continue;
    const kind = x.type;
    const sub = x.state === "err"
      ? ((x.type === "source" ? x.s.原因 : (x.k.状态 === "需人工" ? x.k.原因 : (x.errP[0] && x.errP[0].原因))) || "需要人工处理")
      : x.type === "clip"
      ? (x.k.开头钩子 || x.k.概要 || `${x.k.起始 || ""}–${x.k.结束 || ""}`)
      : (x.s.摘要 || `${x.s.来源} · ${x.s.日期}`);
    if (!match(x.id, x.title, sub)) continue;
    const bucket = x.state === "err" ? "err" : (x.state === "fail" || x.state === "off") ? "fail" : x.state === "ok" ? "done" : "active";
    if (ovFilter !== "all" && ovFilter !== bucket) continue;
    const thumb = (x.type === "clip" && ((x.k.成片 && `/thumb?path=${encodeURIComponent(x.k.成片)}&at=2`) || (x.k.预览 && x.k.预览.文件 && `/thumb?path=${encodeURIComponent(x.k.预览.文件)}&at=${Math.max(1, Math.round(x.k.预览.起 || 2))}`)))
      || (x.type === "source" && x.s.文件 && x.s.文件.视频 && x.s.文件.视频[0] && `/thumb?path=${encodeURIComponent(x.s.文件.视频[0])}&at=3`) || "";
    const dur = x.type === "clip" && (x.k.成片时长_秒 || x.k.时长_秒) ? `${Math.round(x.k.成片时长_秒 || x.k.时长_秒)}s` : "";
    rows.push({ kind, id: x.id, title: x.title, label: x.label, state: x.state, bucket, sub, thumb, dur, openType: x.type });
  }

  // 把已拆出合格切片的原始录像纳入「合格 · 已完成」
  for (const s of S.素材) {
    const n = S.切片.filter(k => k.source_id === s.source_id).length;
    if (!n) continue;
    const sub = s.摘要 || `${s.来源} · ${s.日期} · 已拆出 ${n} 条合格候选`;
    if (!match(s.source_id, s.标题 || s.source_id, sub)) continue;
    const bucket = s.状态 === "需人工" ? "err" : s.状态 === "已复盘" ? "done" : "active";
    if (ovFilter !== "all" && ovFilter !== bucket) continue;
    const thumb = (s.文件 && s.文件.视频 && s.文件.视频[0]) ? `/thumb?path=${encodeURIComponent(s.文件.视频[0])}&at=3` : "";
    rows.push({
      kind: "source", id: s.source_id, title: s.标题 || s.source_id,
      label: `合格 · 拆出 ${n} 条切片`, state: bucket === "done" ? "ok" : bucket === "err" ? "err" : "queue",
      bucket, sub, thumb, dur: "", openType: "source-page"
    });
  }

  if (!rows.length) {
    return `<div class="empty-box">${q ? `没有匹配「${esc(ovSearch)}」的记录` : "当前筛选条件下暂无记录"}</div>`;
  }

  const groups = [
    { key: "err", title: "需处理 / 剪辑异常", hint: "剪辑不达标或异常，可直接放弃或移出 SQLite" },
    { key: "active", title: "进行中 / 待拍板", hint: "AI 处理中或等你审核的合格条目" },
    { key: "done", title: "合格 · 已完成 / 已发布", hint: "已拆出合格切片的录像、已定时或已发布成片" },
    { key: "fail", title: "不合格 / 未通过筛选（含已放弃）", hint: "未满足时长或独立观点标准，可直接查看原因或移出 SQLite" }
  ];

  return groups.map(g => {
    const list = rows.filter(r => r.bucket === g.key);
    if (!list.length) return "";
    return `<div class="ov-group">
      <div class="ov-group-hd">
        <span>${esc(g.title)} <span class="dim num" style="margin-left:6px">${list.length}</span></span>
        <span class="dim" style="font-weight:400;font-size:12px">${esc(g.hint)}</span>
      </div>
      ${list.map(r => {
        const pillCls = { me: "me", err: "err", run: "run", ok: "ok", fail: "fail", off: "fail" }[r.state] || "";
        const onOpen = r.openType === "source-page" ? `go('sources')` : `openItem('${r.openType}','${esc(r.id)}')`;
        return `<div class="ov-row">
          <div class="ov-row-thumb" onclick="${onOpen}">${r.thumb ? `<img src="${esc(r.thumb)}" alt="">` : ic(r.kind === "source" ? "film" : "scissors", 18)}</div>
          <div class="ov-row-main" onclick="${onOpen}">
            <div class="ov-row-top">
              <span class="pill ${pillCls}">${esc(r.label)}</span>
              <span class="ov-id">${esc(r.id)}</span>
              ${r.dur ? `<span class="dim num" style="font-size:11.5px">${esc(r.dur)}</span>` : ""}
            </div>
            <div class="ov-row-title">${esc(r.title)}</div>
            <div class="ov-row-sub">${esc(r.sub)}</div>
          </div>
          <div class="ov-row-acts">
            <button class="btn sm" onclick="${onOpen}">查看</button>
            <button class="btn sm bad" title="从 SQLite 移除（绝不删原片）" onclick="deleteRecord('${r.kind}','${esc(r.id)}','${esc(r.title)}')">${ic("trash", 13)} 移除</button>
          </div>
        </div>`;
      }).join("")}
    </div>`;
  }).join("");
}

function sources() {
  if (!S.素材.length && !(S.收件 || []).length) {
    return `<div class="page-head"><div><h2>原始录像</h2><p>放进「待加工」的长视频会自动转写逐字稿、生成课程复盘并拆出候选片段。</p></div></div>

function mdToHtml(src) {
  const lines = String(src || "").replace(/\r\n/g, "\n").split("\n");
  let out = "", inUl = false, inTable = false, tableRows = [];
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b style='color:#fff'>$1</b>");
  const flushUl = () => { if (inUl) { out += "</ul>"; inUl = false; } };
  const flushTable = () => {
    if (!inTable) return;
    const body = tableRows.filter(r => !/^\|[\s\-:|]+\|$/.test(r.trim()));
    if (body.length) {
      out += "<table>" + body.map((r, idx) => {
        const cells = r.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
        const tag = idx === 0 ? "th" : "td";
        return `<tr>${cells.map(c => `<${tag}>${c}</${tag}>`).join("")}</tr>`;
      }).join("") + "</table>";
    }
    inTable = false; tableRows = [];
  };
  for (const raw of lines) {
    const l = raw.trim();
    if (l.startsWith("|") && l.endsWith("|")) { flushUl(); inTable = true; tableRows.push(l); continue; }
    flushTable();
    if (!l) { flushUl(); continue; }
    if (l.startsWith("### ")) { flushUl(); out += `<h3>${inline(l.slice(4))}</h3>`; }
    else if (l.startsWith("## ")) { flushUl(); out += `<h2>${inline(l.slice(3))}</h2>`; }
    else if (l.startsWith("# ")) { flushUl(); out += `<h1>${inline(l.slice(2))}</h1>`; }
    else if (l.startsWith("> ")) { flushUl(); out += `<blockquote>${inline(l.slice(2))}</blockquote>`; }
    else if (/^[-*]\s+/.test(l) || /^\d+\.\s+/.test(l)) {
      if (!inUl) { out += "<ul>"; inUl = true; }
      out += `<li>${inline(l.replace(/^([-*]|\d+\.)\s+/, ""))}</li>`;
    } else { flushUl(); out += `<p style="margin:6px 0">${inline(l)}</p>`; }
  }
  flushUl(); flushTable();
  return out;
}

    </div>`;

  $("#drawer").innerHTML = `
    <div class="dh">
      <div>
        <h2>SOP 底层逻辑与判断规则</h2>

      </div>

      <ul>${cur.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>
    </div>

      ? `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">

  if (cur.file) {
    try {
      if (!rulesCache[cur.file]) {
        const resp = await fetch(file(cur.file));

}

        </div>
        ${vids[0] ? `<button class="btn sm" onclick="reveal('${esc(vids[0])}')">${ic("folder", 14)} 原片目录</button>` : ""}
        <button class="btn sm" onclick="closeDrawer()">关闭</button>
      </div>
      ${x.state === "err"
        ? `<div class="task-panel err">${errBlock(x, false)}</div>`

            ${s.摘要 ? `<div class="callout" style="margin-top:10px;line-height:1.75">${esc(s.摘要)}</div>` : ""}

            <div class="btns" style="margin-top:14px">

  const { k, ps } = x;

  }

const TAGS = {
  pickOff: ["跑题", "干货弱", "太散", "重复了", "不想露脸"],
  review: ["太长", "钩子弱", "节奏慢", "字幕错字", "结尾突兀"],
  cover: ["字太小", "配色违和", "图形不贴题", "不够醒目"]
};
function tagRow(key, list) {
  const on = tagSel[key] || [];
  return `<div class="tags">${list.map(t => `<span class="tag ${on.includes(t) ? "on" : ""}" onclick="toggleTag('${key}','${t}')">${t}</span>`).join("")}</div>`;
}
function toggleTag(key, t) {
  const a = (tagSel[key] = tagSel[key] || []);
  const i = a.indexOf(t);
  i < 0 ? a.push(t) : a.splice(i, 1);
  renderDrawerKeep();
}
function renderDrawerKeep() {
  const keep = {};
  document.querySelectorAll("#drawer textarea,#drawer input[type=text]").forEach(e => { if (e.id) keep[e.id] = e.value; });
  renderDrawer();
  for (const [id, v] of Object.entries(keep)) { const e = document.getElementById(id); if (e) e.value = v; }
}

/* ================= 在线封面工坊编辑器 (Cover Studio: 改字 / 换比例 / 裁剪) ================= */
const CS_RATIOS = { "3:4": [1080, 1440], "4:3": [1440, 1080], "9:16": [1080, 1920], "16:9": [1920, 1080] };
let csMode = {}, csState = {}, csImages = {};

function getCsState(id, k) {
  if (!csState[id]) {
    const raw = (k && k.封面字) || (k && k.标题) || "写好标题\n【突出关键词】";
    const parts = raw.includes("\n") ? raw.split("\n") : [raw.slice(0, Math.ceil(raw.length / 2)), raw.slice(Math.ceil(raw.length / 2))];
    csState[id] = {
      ratio: "3:4",
      style: "obsidian",
      line1: (parts[0] || "").trim(),
      line2: (parts[1] || "").trim(),
      badge: "",
      fontScale: 100,
      textY: 38,
      zoom: 1.0,
      panX: 0,
      panY: 0,
      frameAt: 12,
      grid: false,
      bgUrl: ""
    };
  }
  return csState[id];
}

function openCoverStudioFrom(id) {
  const k = S.切片.find(c => c.clip_id === id);
  const st = getCsState(id, k);
  if (coverSel[id]) {
    st.bgUrl = file(coverSel[id]);
    csLoadImage(id, st.bgUrl);
  }
  csMode[id] = "edit";
  renderDrawer();
}

function csSetStyle(id, style) {
  const k = S.切片.find(c => c.clip_id === id);
  const st = getCsState(id, k);
  st.style = style;
  if (style === "video") {
    st.textY = 74;
    if (k && k.成片) csLoadVideoFrame(id, st.frameAt);
  } else if (style === "crop") {
    st.textY = 76;
    const src = st.bgUrl || (coverSel[id] ? file(coverSel[id]) : (k && k.封面候选 && k.封面候选[0] ? file(k.封面候选[0]) : ""));
    if (src) { st.bgUrl = src; csLoadImage(id, src); }
  } else {
    st.textY = 38;
  }
  renderDrawerKeep();
}

function csUpdate(id, key, val, rerender = false) {
  const k = S.切片.find(c => c.clip_id === id);
  const st = getCsState(id, k);
  st[key] = val;
  if (rerender) renderDrawerKeep();
  else drawCoverPreview(id);
}

function csResetCrop(id) {
  const k = S.切片.find(c => c.clip_id === id);
  const st = getCsState(id, k);
  st.zoom = 1.0; st.panX = 0; st.panY = 0;
  renderDrawerKeep();
}

function csLoadImage(id, url) {
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = () => { csImages[id] = img; drawCoverPreview(id); };
  img.src = url;
}

function csLoadVideoFrame(id, sec) {
  const k = S.切片.find(c => c.clip_id === id);
  const st = getCsState(id, k);
  st.frameAt = sec;
  const srcVid = (k && k.预览 && k.预览.文件) || (k && k.成片);
  if (!srcVid) return;
  const at = (k && k.预览 && k.预览.文件) ? Math.max(1, (k.预览.起 || 0) + sec) : sec;
  const url = `/thumb?path=${encodeURIComponent(srcVid)}&at=${at}`;
  st.bgUrl = url;
  csLoadImage(id, url);
}

function csLoadLocalBg(id, f) {
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const k = S.切片.find(c => c.clip_id === id);
    const st = getCsState(id, k);
    st.bgUrl = rd.result;
    st.style = "crop";
    csLoadImage(id, rd.result);
    renderDrawerKeep();
  };
  rd.readAsDataURL(f);
}

function initCoverStudio(id) {
  const k = S.切片.find(c => c.clip_id === id);
  const st = getCsState(id, k);
  if ((st.style === "video" || st.style === "crop") && !csImages[id]) {
    if (st.bgUrl) csLoadImage(id, st.bgUrl);
    else if (st.style === "video") csLoadVideoFrame(id, st.frameAt);
  }
  drawCoverPreview(id);
  const cv = $("#cs-canvas");
  if (!cv || cv._boundDrag) return;
  cv._boundDrag = true;
  let drag = null;
  cv.onpointerdown = e => {
    const s = csState[id];
    if (!s || (s.style !== "video" && s.style !== "crop")) return;
    cv.setPointerCapture(e.pointerId);
    drag = { x: e.clientX, y: e.clientY, px: s.panX, py: s.panY };
  };
  cv.onpointermove = e => {
    if (!drag) return;
    const s = csState[id];
    const r = cv.getBoundingClientRect();
    s.panX = Math.max(-50, Math.min(50, Math.round(drag.px + ((e.clientX - drag.x) / Math.max(1, r.width)) * 100)));
    s.panY = Math.max(-50, Math.min(50, Math.round(drag.py + ((e.clientY - drag.y) / Math.max(1, r.height)) * 100)));
    drawCoverPreview(id);
  };
  cv.onpointerup = () => { drag = null; };
}

function drawCoverPreview(id) {
  const cv = $("#cs-canvas");
  if (!cv) return;
  const k = S.切片.find(c => c.clip_id === id);
  const st = getCsState(id, k);
  const [W, H] = CS_RATIOS[st.ratio] || [1080, 1440];
  const scale = 0.4;
  cv.width = Math.round(W * scale);
  cv.height = Math.round(H * scale);
  renderCoverCanvas(cv, st, csImages[id], true);
}

function parseCoverSegs(line, normal, accent) {
  return String(line || "").split(/(【[^】]*】)/g).filter(Boolean).map(p =>
    p.startsWith("【") && p.endsWith("】") ? { t: p.slice(1, -1), c: accent, hi: true } : { t: p, c: normal, hi: false }
  );
}

function renderCoverCanvas(cv, st, bgImg, showGrid) {
  const ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;
  const u = Math.min(W, H);
  ctx.clearRect(0, 0, W, H);

  const isLight = st.style === "swiss";
  const accentMap = { obsidian: "#FCD34D", swiss: "#DC2626", crimson: "#FDE047", cyber: "#38BDF8", video: "#FCD34D", crop: "#FCD34D" };
  const accent = accentMap[st.style] || "#FCD34D";
  const textCol = isLight ? "#12141A" : "#FFFFFF";

  // 1. 背景层
  if (st.style === "obsidian") {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#070A12"); g.addColorStop(1, "#121726");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const rg = ctx.createRadialGradient(W * 0.5, H * 0.25, u * 0.05, W * 0.5, H * 0.25, u * 0.65);
    rg.addColorStop(0, "rgba(245, 190, 72, 0.26)"); rg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(255,255,255,0.12)"; ctx.lineWidth = Math.max(1.5, u * 0.002);
    const p = u * 0.055;
    ctx.beginPath(); ctx.roundRect(p, p, W - 2 * p, H - 2 * p, u * 0.032); ctx.stroke();
    ctx.fillStyle = "#F5BE48";
    ctx.beginPath(); ctx.roundRect(W * 0.38, p + u * 0.04, W * 0.24, u * 0.008, 99); ctx.fill();
  } else if (st.style === "swiss") {
    ctx.fillStyle = "#F6F3EC"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#DC2626"; ctx.fillRect(0, 0, W, u * 0.022);
    ctx.fillStyle = "#DC2626"; ctx.fillRect(W * 0.08, H * 0.11, u * 0.12, u * 0.013);
    ctx.fillStyle = "#12141A"; ctx.fillRect(W * 0.08, H * 0.72, W * 0.84, Math.max(2, u * 0.004));
    ctx.fillStyle = "#12141A";
    ctx.beginPath(); ctx.roundRect(W * 0.08, H * 0.76, W * 0.5, H * 0.16, u * 0.022); ctx.fill();
    ctx.strokeStyle = "#12141A"; ctx.lineWidth = Math.max(2, u * 0.004);
    ctx.beginPath(); ctx.roundRect(W * 0.62, H * 0.76, W * 0.3, H * 0.16, u * 0.022); ctx.stroke();
    ctx.fillStyle = "#DC2626";
    ctx.beginPath(); ctx.arc(W * 0.77, H * 0.84, Math.min(W * 0.1, H * 0.055), 0, Math.PI * 2); ctx.fill();
  } else if (st.style === "crimson") {
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, "#1C070B"); g.addColorStop(0.55, "#450A14"); g.addColorStop(1, "#0B0609");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const rg = ctx.createRadialGradient(W * 0.5, H * 0.45, u * 0.04, W * 0.5, H * 0.45, u * 0.72);
    rg.addColorStop(0, "rgba(239, 68, 68, 0.38)"); rg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(253, 224, 71, 0.45)"; ctx.lineWidth = Math.max(2, u * 0.003);
    ctx.strokeRect(u * 0.05, u * 0.05, W - u * 0.1, H - u * 0.1);
  } else if (st.style === "cyber") {
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, "#0A1028"); g.addColorStop(1, "#1C0C34");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const g1 = ctx.createRadialGradient(W * 0.22, H * 0.2, 0, W * 0.22, H * 0.2, u * 0.6);
    g1.addColorStop(0, "rgba(56, 189, 248, 0.35)"); g1.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g1; ctx.fillRect(0, 0, W, H);
    const g2 = ctx.createRadialGradient(W * 0.8, H * 0.78, 0, W * 0.8, H * 0.78, u * 0.6);
    g2.addColorStop(0, "rgba(139, 92, 246, 0.35)"); g2.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
    const p = u * 0.075;
    ctx.fillStyle = "rgba(14, 19, 36, 0.72)";
    ctx.strokeStyle = "rgba(56, 189, 248, 0.5)"; ctx.lineWidth = Math.max(2, u * 0.003);
    ctx.beginPath(); ctx.roundRect(p, H * 0.14, W - 2 * p, H * 0.72, u * 0.036); ctx.fill(); ctx.stroke();
  } else if ((st.style === "video" || st.style === "crop") && bgImg) {
    ctx.fillStyle = "#080A10"; ctx.fillRect(0, 0, W, H);
    const baseScale = Math.max(W / bgImg.width, H / bgImg.height) * (st.zoom || 1);
    const dw = bgImg.width * baseScale, dh = bgImg.height * baseScale;
    const dx = (W - dw) / 2 + (st.panX / 100) * W;
    const dy = (H - dh) / 2 + (st.panY / 100) * H;
    ctx.drawImage(bgImg, dx, dy, dw, dh);
    // 柔和上下电影暗角遮罩，保证大字清晰可读
    const ov = ctx.createLinearGradient(0, 0, 0, H);
    ov.addColorStop(0, "rgba(5,8,15,0.68)");
    ov.addColorStop(0.32, "rgba(5,8,15,0.12)");
    ov.addColorStop(0.58, "rgba(5,8,15,0.18)");
    ov.addColorStop(1, "rgba(5,8,15,0.88)");
    ctx.fillStyle = ov; ctx.fillRect(0, 0, W, H);
  } else {
    ctx.fillStyle = "#0D111C"; ctx.fillRect(0, 0, W, H);
  }

  // 2. 文字排版（严格自适应安全宽度，绝不截断！）
  const lines = [st.line1, st.line2].map(s => (s || "").trim()).filter(Boolean);
  if (lines.length) {
    const maxW = W * 0.84;
    let fsize = Math.round(u * 0.135 * ((st.fontScale || 100) / 100));
    const fontFamily = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
    const measureLine = (ln, sz) => {
      ctx.font = `900 ${sz}px ${fontFamily}`;
      return parseCoverSegs(ln, textCol, accent).reduce((acc, s) => acc + ctx.measureText(s.t).width + (isLight && s.hi ? sz * 0.24 : 0), 0);
    };
    while (fsize > 20 && Math.max(...lines.map(l => measureLine(l, fsize))) > maxW) fsize -= 2;

    const lh = fsize * 1.28;
    const totalH = lh * lines.length;
    const cy = Math.max(totalH / 2 + H * 0.08, Math.min(H - totalH / 2 - H * 0.08, H * ((st.textY || 38) / 100)));
    let y = cy - totalH / 2 + fsize * 0.88;

    // 可选顶部角标
    if ((st.badge || "").trim()) {
      const bsz = Math.round(fsize * 0.34);
      ctx.font = `700 ${bsz}px ${fontFamily}`;
      const bw = ctx.measureText(st.badge.trim()).width + bsz * 1.4;
      const bh = bsz * 1.8;
      const bx = isLight ? W * 0.08 : (W - bw) / 2;
      const by = cy - totalH / 2 - bh - fsize * 0.24;
      ctx.fillStyle = isLight ? "#12141A" : "rgba(255,255,255,0.12)";
      ctx.strokeStyle = isLight ? "#12141A" : accent;
      ctx.lineWidth = Math.max(1, u * 0.002);
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 999); ctx.fill(); ctx.stroke();
      ctx.fillStyle = isLight ? "#FFFFFF" : accent;
      ctx.fillText(st.badge.trim(), bx + bsz * 0.7, by + bh * 0.68);
    }

    ctx.font = `900 ${fsize}px ${fontFamily}`;
    for (const ln of lines) {
      const segs = parseCoverSegs(ln, textCol, accent);
      const lw = measureLine(ln, fsize);
      let x = isLight ? W * 0.08 : (W - lw) / 2;
      for (const s of segs) {
        const sw = ctx.measureText(s.t).width;
        if (isLight && s.hi) {
          x += fsize * 0.08;
          ctx.fillStyle = "#DC2626";
          ctx.beginPath(); ctx.roundRect(x - fsize * 0.08, y - fsize * 0.92, sw + fsize * 0.16, fsize * 1.14, fsize * 0.12); ctx.fill();
          ctx.fillStyle = "#FFFFFF";
          ctx.fillText(s.t, x, y);
          x += sw + fsize * 0.16;
        } else {
          if (!isLight) {
            ctx.shadowColor = "rgba(0,0,0,0.75)";
            ctx.shadowBlur = fsize * 0.18;
            ctx.shadowOffsetY = fsize * 0.05;
          }
          ctx.fillStyle = s.c;
          ctx.fillText(s.t, x, y);
          ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
          x += sw;
        }
      }
      y += lh;
    }
  }

  // 3. 安全区与三分线参考网格（仅预览时显示，导出时绝不画进去！）
  if (showGrid && st.grid) {
    ctx.save();
    ctx.strokeStyle = "rgba(56, 189, 248, 0.45)";
    ctx.setLineDash([6, 6]); ctx.lineWidth = 1;
    ctx.strokeRect(W * 0.08, H * 0.08, W * 0.84, H * 0.84);
    for (const k of [1 / 3, 2 / 3]) {
      ctx.beginPath(); ctx.moveTo(W * k, 0); ctx.lineTo(W * k, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, H * k); ctx.lineTo(W, H * k); ctx.stroke();
    }
    ctx.restore();
  }
}

function exportCoverDataUrl(st, bgImg, overrideRatio) {
  const r = overrideRatio || st.ratio || "3:4";
  const [W, H] = CS_RATIOS[r] || [1080, 1440];
  const off = document.createElement("canvas");
  off.width = W; off.height = H;
  renderCoverCanvas(off, { ...st, ratio: r, grid: false }, bgImg, false);
  return off.toDataURL("image/png");
}

function downloadCoverStudio(id) {
  const k = S.切片.find(c => c.clip_id === id);
  const st = getCsState(id, k);
  const a = document.createElement("a");
  a.href = exportCoverDataUrl(st, csImages[id], st.ratio);
  a.download = `${id}_封面_${st.ratio.replace(":", "x")}.png`;
  a.click();
  toast("已下载高清 PNG 封面");
}

async function saveCoverStudio(id) {
  const k = S.切片.find(c => c.clip_id === id);
  const st = getCsState(id, k);
  const btn = $("#cs-save-btn");
  if (btn) { btn.disabled = true; btn.textContent = "正在生成高清竖版 + 横版封面…"; }
  const vUrl = exportCoverDataUrl(st, csImages[id], st.ratio);
  const hUrl = exportCoverDataUrl(st, csImages[id], st.ratio === "16:9" ? "16:9" : "4:3");
  const j = await post({
    动作: "保存自定义封面",
    id,
    比例: st.ratio,
    竖版数据: vUrl,
    横版数据: hUrl,
    备注: `${st.style} / ${st.ratio}`
  });
  if (!j.成功) {
    toast(j.输出 || j.错误 || "保存失败", false);
    if (btn) { btn.disabled = false; btn.textContent = "保存并设为封面（同步出横版）"; }
    return;
  }
  afterGate(id, "coverpick", j.输出 || "封面已保存，下一步请确认发布");
}

async function pickCover(id, pid) {
  const note = ($("#cnote") || {}).value || "";
  const j = await post({ 动作: "选封面", id: pid, 文件: coverSel[id], 备注: note, 标签: tagSel["cv-" + id] || [] });
  if (!j.成功) { toast(j.输出 || j.错误 || "操作未生效", false); return; }
  afterGate(id, "coverpick", "封面已选好，AI 将自动补齐横版");
}

async function redoCover(id) {
  const note = ($("#cnote") || {}).value || "";
  const tags = tagSel["cv-" + id] || [];
  const k = S.切片.find(c => c.clip_id === id);
  if (!note.trim() && !tags.length && !(k.封面参考 || []).length) { toast("请写明修改方向或上传参考图", false); return; }
  const j = await post({ 动作: "封面重做", id, 备注: [tags.length ? "【" + tags.join("、") + "】" : "", note].join(""), 标签: tags });
  if (!j.成功) { toast(j.输出 || j.错误 || "操作未生效", false); return; }
  afterGate(id, "coverpick", "已发回重新生图");
}

function uploadRef(id, f) {
  if (!f) return;
  if (f.size > 10e6) { toast("图片不能超过 10 MB", false); return; }
  const rd = new FileReader();
  rd.onload = async () => { await act({ 动作: "上传参考", id, 文件名: f.name, 数据: rd.result, 全局: false }); renderDrawerKeep(); };
  rd.readAsDataURL(f);
}

function bindDrop() {
  const d = $("#drop");
  if (!d) return;
  const id = openId;
  d.ondragover = e => { e.preventDefault(); d.classList.add("over"); };
  d.ondragleave = () => d.classList.remove("over");
  d.ondrop = e => { e.preventDefault(); d.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) uploadRef(id, f); };
}

function authorize(id) {
  const ready = activePubs(pubsOf(id)).filter(p => p.状态 === "草稿" && p.封面竖文件 && p.封面横文件);
  const sel = ready.filter(p => pubSel[p.publish_id]);
  if (!sel.length) { toast("请至少勾选一个平台", false); return; }
  if (sel.some(p => dirty[p.publish_id])) { toast("请先点击「保存文案改动」", false); return; }
  modal("确认排期定时发布？", `${sel.map(p => `<b style="color:#fff">${esc(p.平台)}</b>：${esc(p.标题)}`).join("<br>")}<br><br>系统会自动排入最近空档（${esc(((S.配置.发布排期 || {}).时间点 || []).join(" / "))}）并设为<b style="color:#7dd3fc">定时发布</b>，绝不会立即发出。`, "确认定时发布", async () => {
    let ok = true;
    for (const p of sel) {
      const j = await post({ 动作: "发布状态", id: p.publish_id, 状态: "待发布" });
      ok &= !!j.成功;
      if (!j.成功) toast(p.平台 + "：" + (j.输出 || j.错误), false);
    }
    if (ok) afterGate(id, "auth", "已加入定时发布队列");
    else load();
  });
}

function discard(id) {
  const ready = activePubs(pubsOf(id)).filter(p => p.状态 === "草稿");
  modal("确定不发这条视频？", "本地成片文件仍会保留，随时可在回收站恢复。", "确认不发", async () => {
    for (const p of ready) await post({ 动作: "发布状态", id: p.publish_id, 状态: "已废弃" });
    afterGate(id, "auth", "已移入回收站");
  }, true);
}

/* ================= 实时轮询、计时器与 ⌘V 粘贴视频 ================= */
let pollTimer = null;
async function pollLive() {
  try { L = await (await fetch("/api/live")).json(); } catch (e) { L = { 错误: 1 }; }
  if (L && L.在干活) aiStarting = null;
  else if (aiStarting && Date.now() - aiStarting.startedAt > 12000) aiStarting = null;
  renderLiveSide();
  const sig = JSON.stringify([L && L.在干活, L && L.环节, L && L.对象, L && L.实时进度, L && L.下一步 && L.下一步.环节]);
  const idle = !openId && !$("#drawer").classList.contains("open") && !picked.size && $("#modal").style.display !== "flex" && !searchQ;
  if (S && wasBusy !== null && wasBusy !== !!(L && L.在干活)) {
    const justFinished = wasBusy && !(L && L.在干活);
    if (idle) {
      await load();
      if (justFinished) {
        const nextMine = mineItems();
        if (nextMine.length) {
          feedTab = "todo";
          render();
          toast(`AI 已完成「${(L && L.上次 && L.上次.环节) || "当前步骤"}」，下一步请拍板：${nextMine[0].label}`);
        } else {
          toast(`AI 已完成「${(L && L.上次 && L.上次.环节) || "当前步骤"}」`);
        }
      }
    }
  } else if (S && sig !== liveSig && page === "board" && idle) {
    render();
  } else if (L && L.在干活) {
    const ln = $("#ai-live-line");
    if (ln && L.实时进度) ln.textContent = L.实时进度;
  }
  liveSig = sig;
  wasBusy = !!(L && L.在干活);
  clearTimeout(pollTimer);
  pollTimer = setTimeout(pollLive, (L && L.在干活) || aiStarting ? 1500 : 3500);
}
setTimeout(pollLive, 250);

// 实时每秒刷新已运行计时器
setInterval(() => {
  const el = $("#ai-elapsed");
  if (!el) return;
  const startMs = (L && L.在干活 && L.开始) ? new Date(L.开始).getTime() : (aiStarting ? aiStarting.startedAt : 0);
  if (startMs) {
    const sec = Math.max(0, Math.floor((Date.now() - startMs) / 1000));
    el.textContent = "已运行 " + (fmtClock(sec) || "00:00");
  }
}, 1000);

// 全局 ⌘V 粘贴视频支持（兼容浏览器剪贴板文件、本地路径文本、macOS 访达原生复制文件）
addEventListener("paste", e => {
  const tag = (e.target && e.target.tagName || "").toLowerCase();
  const inText = (tag === "input" && !["checkbox", "file"].includes(e.target.type)) || tag === "textarea" || (e.target && e.target.isContentEditable);
  const cd = e.clipboardData;
  const files = cd ? Array.from(cd.files || []).filter(f => /\.(mp4|mov|mkv|m4v)$/i.test(f.name) || (f.type || "").startsWith("video/")) : [];
  if (files.length) {
    e.preventDefault();
    uploadVideos(files);
    return;
  }
  if (inText) return;
  const txt = (cd && cd.getData("text") || "").trim();
  if (txt && (/\.(mp4|mov|mkv|m4v)[\s"']*$/i.test(txt) || txt.startsWith("file://"))) {
    e.preventDefault();
    pasteFromClipboard(txt);
    return;
  }
  // 在页面空白/操作舱处按 ⌘V 且未在文本输入框内时，直接尝试读取 macOS 访达复制的视频文件
  if (!txt && page === "board" && !openId && $("#modal").style.display !== "flex") {
    e.preventDefault();
    pasteFromClipboard();
  }
});

addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if ($("#modal").style.display === "flex") closeModal();
    else if ($("#drawer").classList.contains("open")) closeDrawer();
  }
});
addEventListener("hashchange", () => { page = hashPage(); render(); });
setInterval(() => {
  if (document.hidden || openId || $("#drawer").classList.contains("open") || picked.size || $("#modal").style.display === "flex" || searchQ) return;
  load();
}, 20000);
load();
</script>
