<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>即刻剪辑 · 视频 SOP 工作台</title>
<style>
:root {
  /* 四级清晰明度阶梯: 画布 -> 侧栏 -> 常规卡片 -> 悬浮控制台 */
  --bg-canvas: #07080c;
  --bg-sidebar: #0b0d13;
  --bg-card: #131722;
  --bg-card-hover: #181d2b;
  --bg-dock: #191e2c;
  --bg-elevated: #22283a;
  --bg-input: #0d1018;

  --border-subtle: rgba(255, 255, 255, 0.07);
  --border-mid: rgba(255, 255, 255, 0.12);
  --border-strong: rgba(255, 255, 255, 0.2);

  --text-primary: #f4f7fb;
  --text-secondary: #9ca4b4;
  --text-muted: #697284;

  --accent-cyan: #38bdf8;
  --accent-cyan-soft: rgba(56, 189, 248, 0.14);
  --accent-emerald: #34d399;
  --accent-emerald-soft: rgba(52, 211, 153, 0.14);
  --accent-violet: #a78bfa;
  --accent-violet-soft: rgba(167, 139, 250, 0.15);
  --accent-amber: #fbbf24;
  --accent-amber-soft: rgba(251, 191, 36, 0.14);
  --accent-coral: #f87171;
  --accent-coral-soft: rgba(248, 113, 113, 0.14);

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-pill: 999px;
  --shadow-dock: inset 0 1px 0 rgba(255, 255, 255, 0.11), 0 24px 60px rgba(0, 0, 0, 0.58);
  --shadow-float: 0 24px 56px rgba(0, 0, 0, 0.65);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
}

*, *::before, *::after { box-sizing: border-box; }
::selection { background: rgba(56, 189, 248, 0.28); color: #ffffff; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--bg-canvas);
  color: var(--text-primary);
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  caret-color: var(--accent-cyan);
}
body { display: flex; overflow: hidden; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.13); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.24); }

button, input, textarea { font: inherit; color: inherit; }
a { color: var(--accent-cyan); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid rgba(56, 189, 248, 0.55); outline-offset: 2px; }

.num { font-variant-numeric: tabular-nums; }
.svg-ic { display: inline-flex; align-items: center; justify-content: center; flex: none; vertical-align: middle; }

/* ================= 极简左侧栏 (零杂乱列表) ================= */
aside {
  width: 220px;
  flex: none;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  padding: 18px 12px;
  transition: width 200ms var(--ease-out), padding 200ms var(--ease-out);
  z-index: 10;
}
body.collapsed aside { width: 68px; padding: 18px 10px; }
body.collapsed .hide-col { display: none !important; }
body.collapsed .brand-row, body.collapsed .nav-btn, body.collapsed .space-pill, body.collapsed .engine-card { justify-content: center; padding-left: 0; padding-right: 0; }

.brand-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 6px;
  margin-bottom: 18px;
}
.brand { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.brand-title { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; display: flex; align-items: center; gap: 6px; }
.brand-tag {
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 5px;
  background: rgba(56, 189, 248, 0.14);
  color: #7dd3fc;
}

.icon-ghost {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  border: 0;
  background: transparent;
  color: var(--text-secondary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 150ms, color 150ms;
}
.icon-ghost:hover { background: rgba(255, 255, 255, 0.07); color: var(--text-primary); }

.space-pill {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 11px;
  margin-bottom: 16px;
  border-radius: 11px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border-subtle);
  cursor: pointer;
  transition: border-color 150ms, background 150ms;
}
.space-pill:hover { background: rgba(255, 255, 255, 0.07); border-color: var(--border-mid); }
.space-avatar {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: linear-gradient(135deg, #38bdf8, #818cf8);
  color: #07080c;
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
}
.space-name { font-size: 13px; font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.nav-list { display: flex; flex-direction: column; gap: 4px; }
.nav-btn {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 10px 12px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--text-secondary);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  text-align: left;
  transition: background 150ms, color 150ms;
}
.nav-btn:hover { background: rgba(255, 255, 255, 0.05); color: var(--text-primary); }
.nav-btn.on { background: #191e2c; color: #ffffff; font-weight: 600; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08); }
.nav-badge {
  margin-left: auto;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--accent-cyan);
  color: #07080c;
  font-size: 11px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-variant-numeric: tabular-nums;
}
.nav-badge.err { background: var(--accent-coral); color: #07080c; }

.side-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border-subtle); }
.engine-card {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px 11px;
  border-radius: 11px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border-subtle);
  cursor: pointer;
  transition: border-color 150ms, background 150ms;
}
.engine-card:hover { border-color: var(--border-mid); background: rgba(255, 255, 255, 0.06); }
.engine-meta { flex: 1; min-width: 0; }
.engine-title { font-size: 12.5px; font-weight: 600; color: var(--text-primary); }
.engine-sub { font-size: 11px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }

.dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 7px; display: inline-block; background: var(--text-muted); }
.dot.busy { background: var(--accent-emerald); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.55); animation: pulse 1.8s infinite; }
.dot.idle { background: var(--accent-cyan); }
.dot.err { background: var(--accent-coral); }
@keyframes pulse { 70% { box-shadow: 0 0 0 6px rgba(52, 211, 153, 0); } 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); } }

/* ================= 主舞台与顶栏 ================= */
.stage-shell {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  height: 100%;
  background:
    radial-gradient(ellipse 64% 380px at 50% -30px, rgba(56, 189, 248, 0.11), rgba(99, 102, 241, 0.04) 50%, transparent 78%),
    radial-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px);
  background-size: 100% 100%, 26px 26px;
}

.top-header {
  height: 56px;
  flex: none;
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.top-mode-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 12.5px;
  color: var(--text-secondary);
}
.top-actions { display: flex; align-items: center; gap: 8px; }
.top-pill {
  height: 32px;
  padding: 0 13px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border-subtle);
  background: rgba(19, 23, 34, 0.85);
  color: var(--text-secondary);
  font-size: 12.5px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  transition: all 150ms;
}
.top-pill:hover { border-color: var(--border-mid); color: var(--text-primary); background: var(--bg-card-hover); }
.top-pill.on { border-color: rgba(52, 211, 153, 0.35); color: #a7f3d0; background: rgba(52, 211, 153, 0.08); }

main {
  flex: 1;
  overflow-y: auto;
  scrollbar-gutter: stable;
  padding: 12px 36px 96px;
  min-width: 0;
}
.container { max-width: 1220px; margin: 0 auto; }

/* ================= 通用按钮 ================= */
.btn {
  height: 36px;
  padding: 0 16px;
  border-radius: 10px;
  border: 1px solid var(--border-mid);
  background: var(--bg-elevated);
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  white-space: nowrap;
  transition: background 150ms, border-color 150ms, transform 120ms;
}
.btn:hover:not(:disabled) { background: #2a3147; border-color: var(--border-strong); }
.btn:active:not(:disabled) { transform: scale(0.985); }
.btn:disabled { opacity: 0.38; cursor: not-allowed; }

.btn.pri {
  background: #ffffff;
  color: #07080c;
  border-color: #ffffff;
  font-weight: 600;
  box-shadow: 0 4px 16px rgba(255, 255, 255, 0.12);
}
.btn.pri:hover:not(:disabled) { background: #e6f4ff; border-color: #e6f4ff; }

.btn.pill-cta { border-radius: var(--radius-pill); padding: 0 18px; }
.btn.bad { background: rgba(248, 113, 113, 0.12); border-color: rgba(248, 113, 113, 0.28); color: #fca5a5; }
.btn.bad:hover:not(:disabled) { background: rgba(248, 113, 113, 0.2); border-color: rgba(248, 113, 113, 0.45); }
.btn.sm { height: 31px; padding: 0 12px; font-size: 12.5px; border-radius: 8px; }
.btn.xs { height: 27px; padding: 0 10px; font-size: 12px; border-radius: 7px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ================= 第一层: 即梦同款中央悬浮操作舱 ================= */
.hero-stage {
  padding: 8px 0 6px;
  text-align: center;
}
.hero-headline {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.025em;
  margin: 0 0 14px;
  color: #ffffff;
}
.how-steps {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 22px;
  font-size: 13px;
  color: var(--text-secondary);
}
.how-step {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 4px 12px;
  border-radius: var(--radius-pill);
  background: rgba(255, 255, 255, 0.045);
  border: 1px solid var(--border-subtle);
}
.how-num {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: rgba(56, 189, 248, 0.18);
  color: #7dd3fc;
  font-size: 11px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.how-arrow { color: var(--text-muted); font-size: 12px; }

.creation-dock {
  max-width: 880px;
  margin: 0 auto;
  border-radius: var(--radius-xl);
  background: linear-gradient(180deg, #1b2030 0%, #141824 100%);
  border: 1px solid var(--border-mid);
  box-shadow: var(--shadow-dock);
  text-align: left;
  overflow: hidden;
  transition: border-color 180ms;
}
.creation-dock:hover { border-color: rgba(255, 255, 255, 0.18); }
.creation-dock.drag-over { border-color: var(--accent-cyan); background: linear-gradient(180deg, #1d283d 0%, #151c2c 100%); }

.dock-main {
  display: flex;
  align-items: center;
  gap: 22px;
  padding: 24px 26px 20px;
}
.dock-upload-tile {
  width: 66px;
  height: 82px;
  border-radius: 13px;
  background: linear-gradient(145deg, #262d42, #1b2030);
  border: 1px dashed rgba(255, 255, 255, 0.24);
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
  transform: rotate(-4deg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  color: #cbd5e1;
  cursor: pointer;
  flex: none;
  transition: transform 200ms var(--ease-out), border-color 160ms, color 160ms;
}
.dock-upload-tile:hover {
  transform: rotate(0deg) scale(1.04);
  border-color: var(--accent-cyan);
  color: #ffffff;
}
.dock-upload-tile span { font-size: 10.5px; font-weight: 500; }

.dock-copy { flex: 1; min-width: 0; }
.dock-title {
  font-size: 16.5px;
  font-weight: 600;
  color: #ffffff;
  margin-bottom: 5px;
}
.dock-desc {
  font-size: 13.5px;
  color: var(--text-secondary);
  line-height: 1.55;
}
.dock-desc b { color: #7dd3fc; font-weight: 600; }

/* 操作舱内已选视频可视化卡片区 */
.dock-selected-wrap {
  padding: 20px 24px 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.dock-sel-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.dock-sel-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14.5px;
  font-weight: 600;
  color: #ffffff;
}
.dock-sel-grid {
  display: flex;
  align-items: stretch;
  gap: 12px;
  flex-wrap: wrap;
}
.sel-vid-card {
  width: 164px;
  flex: 0 0 164px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: 7px 7px 9px;
  border-radius: 13px;
  background: rgba(8, 10, 16, 0.62);
  border: 1px solid rgba(56, 189, 248, 0.34);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  cursor: pointer;
  position: relative;
  transition: transform 160ms var(--ease-out), border-color 160ms, background 160ms;
}
.sel-vid-card:hover {
  transform: translateY(-1px);
  border-color: rgba(56, 189, 248, 0.68);
  background: rgba(13, 18, 29, 0.8);
}
.sel-vid-thumb {
  width: 100%;
  height: 86px;
  border-radius: 8px;
  background: #0a0d14;
  border: 1px solid rgba(255, 255, 255, 0.1);
  position: relative;
  overflow: hidden;
  flex: none;
}
.sel-vid-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 200ms var(--ease-out);
}
.sel-vid-card:hover .sel-vid-thumb img { transform: scale(1.05); }
.sel-play-btn {
  position: absolute;
  inset: 0;
  margin: auto;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(7, 8, 12, 0.68);
  backdrop-filter: blur(4px);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 150ms, background 150ms;
}
.sel-vid-card:hover .sel-play-btn { transform: scale(1.08); background: rgba(56, 189, 248, 0.9); color: #07080c; border-color: transparent; }
.sel-rm-btn {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 0;
  background: rgba(7, 8, 12, 0.72);
  color: #cbd5e1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 2;
  transition: background 140ms, color 140ms;
}
.sel-rm-btn:hover { background: rgba(248, 113, 113, 0.9); color: #07080c; }
.sel-dur-tag {
  position: absolute;
  right: 5px;
  bottom: 5px;
  padding: 1px 5px;
  border-radius: 4px;
  background: rgba(7, 8, 12, 0.82);
  color: #f4f7fb;
  font-size: 10px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.sel-vid-info { padding: 0 2px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.sel-vid-name {
  font-size: 12.5px;
  font-weight: 600;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sel-vid-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  font-size: 11px;
  color: var(--text-secondary);
}
.sel-add-tile {
  width: 112px;
  flex: 0 0 112px;
  min-height: 138px;
  border-radius: 13px;
  border: 1px dashed rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.025);
  color: var(--text-secondary);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 12px;
  cursor: pointer;
  transition: all 150ms;
}
.sel-add-tile:hover { border-color: var(--accent-cyan); color: #ffffff; background: rgba(56, 189, 248, 0.08); }

/* AI 实时处理动态控制台与流光动画 */
.ai-run-panel {
  padding: 20px 24px 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: radial-gradient(80% 120% at 15% 0%, rgba(56, 189, 248, 0.12), transparent 65%);
}
.ai-run-top {
  display: flex;
  align-items: center;
  gap: 16px;
}
.ai-orb {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  flex: none;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(56, 189, 248, 0.08);
}
.ai-orb::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  padding: 2px;
  background: conic-gradient(from 0deg, #38bdf8, #818cf8, #34d399, transparent 70%, #38bdf8);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  animation: orbSpin 1.35s linear infinite;
}
.ai-orb-core {
  width: 14px;
  height: 14px;
  border-radius: 4px;
  background: linear-gradient(135deg, #38bdf8, #a78bfa);
  transform: rotate(45deg);
  animation: orbBeat 1.5s ease-in-out infinite;
}
@keyframes orbSpin { to { transform: rotate(360deg); } }
@keyframes orbBeat { 0%, 100% { transform: rotate(45deg) scale(0.88); opacity: 0.85; } 50% { transform: rotate(45deg) scale(1.12); opacity: 1; } }

.ai-run-copy { flex: 1; min-width: 0; }
.ai-run-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ai-run-title { font-size: 15.5px; font-weight: 600; color: #ffffff; display: flex; align-items: center; gap: 8px; }
.ai-run-timer {
  font-size: 12px;
  font-weight: 600;
  color: #7dd3fc;
  padding: 2px 9px;
  border-radius: 999px;
  background: rgba(56, 189, 248, 0.14);
  font-variant-numeric: tabular-nums;
}
.ai-run-log {
  margin-top: 5px;
  font-size: 12.5px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ai-shimmer-track {
  height: 5px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  overflow: hidden;
  position: relative;
}
.ai-shimmer-bar {
  position: absolute;
  inset: 0;
  width: 42%;
  border-radius: 999px;
  background: linear-gradient(90deg, transparent, #38bdf8 35%, #818cf8 70%, #34d399 90%, transparent);
  animation: shimmerSlide 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}
@keyframes shimmerSlide {
  0% { transform: translateX(-110%); }
  100% { transform: translateX(260%); }
}
.ai-run-steps {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.ai-step-tag {
  font-size: 11.5px;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.04);
  color: var(--text-muted);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.ai-step-tag.now {
  background: rgba(56, 189, 248, 0.15);
  color: #e0f2fe;
  border: 1px solid rgba(56, 189, 248, 0.35);
  font-weight: 500;
}
.mcard.running-card {
  position: relative;
  overflow: hidden;
  border-color: rgba(52, 211, 153, 0.42);
  background: linear-gradient(135deg, rgba(16, 42, 42, 0.45), var(--bg-card) 65%);
}
.mcard.running-card::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 2.5px;
  background: linear-gradient(90deg, transparent, #34d399, #38bdf8, transparent);
  background-size: 200% 100%;

}
@keyframes cardScan { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.kbd {
  display: inline-flex;
  align-items: center;
  padding: 0 5px;
  height: 18px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);

  color: #cbd5e1;
  font-weight: 600;
}

.dock-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding: 12px 22px;
  background: rgba(7, 8, 12, 0.36);

}
.dock-chips { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dock-chip {
  height: 28px;
  padding: 0 10px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid transparent;
  color: var(--text-secondary);
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  gap: 5px;

}
.dock-chip:hover { background: rgba(255, 255, 255, 0.09); color: var(--text-primary); border-color: var(--border-subtle); }
.dock-chip.static { cursor: default; }
.dock-chip.static:hover { background: rgba(255, 255, 255, 0.05); color: var(--text-secondary); border-color: transparent; }

/* ================= 第二层: 即梦风格 4 大人工关卡视觉卡 ================= */
.studio-sec-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 30px 0 12px;
}
.studio-sec-hd h3 {
  font-size: 15px;
  font-weight: 600;
  margin: 0;
  color: var(--text-primary);
}
.studio-sec-hd span { font-size: 12.5px; color: var(--text-secondary); }

.studio-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
}
@media (max-width: 1120px) { .studio-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 680px) {
  aside { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); }
  .studio-grid { grid-template-columns: 1fr; }
  main { padding: 12px 16px 88px; }
  .top-header { padding: 0 16px; }
  .dock-main { flex-direction: column; align-items: flex-start; }
}

.studio-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 13px 14px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-subtle);
  background: var(--bg-card);
  cursor: pointer;
  text-align: left;
  min-width: 0;
  overflow: hidden;
  transition: transform 180ms var(--ease-out), border-color 180ms, background 180ms;
}
.studio-card:not(.active-gate) { opacity: 0.56; }
.studio-card:hover {
  transform: translateY(-2px);
  border-color: var(--border-strong);
  background: var(--bg-card-hover);
  opacity: 1;
}
.studio-card.active-gate {
  border-color: rgba(56, 189, 248, 0.52);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 0 0 1px rgba(56, 189, 248, 0.18), 0 12px 28px rgba(0, 0, 0, 0.35);
  opacity: 1;
}
.studio-card.c-cyan { background: linear-gradient(135deg, rgba(14, 42, 66, 0.65) 0%, #131722 72%); }
.studio-card.c-violet { background: linear-gradient(135deg, rgba(44, 29, 74, 0.65) 0%, #131722 72%); }
.studio-card.c-amber { background: linear-gradient(135deg, rgba(66, 42, 18, 0.6) 0%, #131722 72%); }
.studio-card.c-emerald { background: linear-gradient(135deg, rgba(16, 54, 46, 0.65) 0%, #131722 72%); }

.studio-art {
  width: 62px;
  height: 62px;
  border-radius: 11px;
  flex: none;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.09);
  display: flex;
  align-items: center;
  justify-content: center;
}
.studio-info { flex: 1; min-width: 0; }
.studio-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 4px; }
.studio-name { font-size: 15px; font-weight: 600; color: #ffffff; }
.studio-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 999px;
  background: #ffffff;
  color: #07080c;
  font-variant-numeric: tabular-nums;
}
.studio-badge.zero {
  background: rgba(255, 255, 255, 0.06);
  color: var(--text-muted);
  font-weight: 500;
}
.studio-sub {
  font-size: 12px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ================= 第三层: 底部分类导航 + 搜索框 + 极简图文卡片 ================= */
.feed-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  margin: 30px 0 18px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-subtle);
}
.feed-tabs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.feed-tab {
  height: 34px;
  padding: 0 15px;
  border-radius: var(--radius-pill);
  border: 0;
  background: transparent;
  color: var(--text-secondary);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 150ms;
}
.feed-tab:hover:not(.on) { color: var(--text-primary); background: rgba(255, 255, 255, 0.04); }
.feed-tab.on {
  background: radial-gradient(120% 150% at 20% 20%, #fff6ec 0%, #f4f8ff 55%, #dff2fe 100%);
  color: #07080c;
  font-weight: 600;
  box-shadow: 0 2px 14px rgba(56, 189, 248, 0.18);
}
.feed-tab .cnt {
  font-size: 11px;
  padding: 0 6px;
  border-radius: 999px;
  background: rgba(7, 8, 12, 0.12);
  font-variant-numeric: tabular-nums;
}
.feed-tab:not(.on) .cnt { background: rgba(255, 255, 255, 0.07); color: var(--text-secondary); }

.search-box {
  position: relative;
  width: 230px;
}
.search-box input {
  width: 100%;
  height: 34px;
  padding: 0 12px 0 34px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border-subtle);
  background: var(--bg-card);
  color: var(--text-primary);
  font-size: 12.5px;
}
.search-box input:focus { outline: none; border-color: rgba(56, 189, 248, 0.45); }
.search-box .s-ic {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
}

/* 双列宽敞图文任务卡 (大幅减字、突出主动作) */
.media-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
@media (max-width: 920px) { .media-grid { grid-template-columns: 1fr; } }

.mcard {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 15px 18px;
  border-radius: var(--radius-lg);
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  cursor: pointer;
  min-width: 0;
  transition: transform 160ms var(--ease-out), border-color 160ms, background 160ms;
}
.mcard:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-mid);
  transform: translateY(-1px);
}
.mcard.me { border-color: rgba(56, 189, 248, 0.24); }
.mcard.me:hover { border-color: rgba(56, 189, 248, 0.48); }
.mcard.err { border-color: rgba(248, 113, 113, 0.35); background: rgba(34, 18, 23, 0.72); }
.mcard.flash { animation: cardFlash 2s var(--ease-out); }
@keyframes cardFlash { 0%, 35% { border-color: var(--accent-cyan); background: rgba(56, 189, 248, 0.12); } 100% { border-color: var(--border-subtle); } }

.mthumb {
  width: 62px;
  height: 82px;
  border-radius: 10px;
  background: linear-gradient(160deg, #1e2538, #10131d);
  border: 1px solid rgba(255, 255, 255, 0.09);
  flex: none;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
}
.mthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mthumb-dur {
  position: absolute;
  bottom: 4px;
  right: 4px;
  padding: 1px 5px;
  border-radius: 4px;
  background: rgba(7, 8, 12, 0.78);
  color: #e2e8f0;
  font-size: 10px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.mbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.mtop { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.mtitle {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.42;
  color: #ffffff;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
}
.msub {
  font-size: 12.5px;
  color: var(--text-secondary);
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.mact { flex: none; display: flex; align-items: center; gap: 8px; }

/* 四阶总览看板 (仅在切到「全流程总览」时展示) */
.macro-board {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
}
@media (max-width: 1120px) { .macro-board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 680px) { .macro-board { grid-template-columns: 1fr; } }

.phase-col {
  background: rgba(17, 20, 30, 0.75);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 14px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.phase-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border-subtle);
  font-size: 13.5px;
  font-weight: 600;
}
.mini-card {
  padding: 12px 13px;
  border-radius: 11px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  cursor: pointer;
  min-width: 0;
  transition: border-color 150ms, background 150ms;
}
.mini-card:hover { border-color: var(--border-mid); background: var(--bg-card-hover); }
.mini-card.me { border-color: rgba(56, 189, 248, 0.28); }
.mini-card .mt {
  font-size: 13.5px;
  font-weight: 500;
  margin-top: 6px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 22px;
  padding: 0 8px;
  border-radius: 6px;
  font-size: 11.5px;
  font-weight: 600;
  background: rgba(255, 255, 255, 0.07);
  color: var(--text-secondary);
  white-space: nowrap;
}
.pill.me { background: var(--accent-cyan-soft); color: #7dd3fc; }
.pill.ok, .pill.run { background: var(--accent-emerald-soft); color: #6ee7b7; }
.pill.re { background: var(--accent-violet-soft); color: #c4b5fd; }
.pill.err, .pill.bad { background: var(--accent-coral-soft); color: #fca5a5; }
.pill.fail { background: rgba(245, 158, 11, 0.16); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.28); }
.pill.ai { background: rgba(129, 140, 248, 0.15); color: #a5b4fc; }
.mcard.fail { border-color: rgba(245, 158, 11, 0.28); background: rgba(245, 158, 11, 0.035); }
.ov-stat.fail-hi { border-color: rgba(245, 158, 11, 0.36); background: rgba(245, 158, 11, 0.08); }

/* 右上角 ? 规则手册抽屉 */
.rule-kpis {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 14px;
}
.rule-kpi {
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border-subtle);
}
.rule-kpi .rk { font-size: 11px; color: var(--text-muted); }
.rule-kpi .rv { font-size: 13px; font-weight: 600; color: #fff; margin-top: 3px; }
.rule-tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.rule-tab {
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--border-subtle);
  background: rgba(255, 255, 255, 0.03);
  color: var(--text-secondary);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all 140ms;
}
.rule-tab:hover { color: #fff; border-color: var(--border-strong); }
.rule-tab.on { background: #ffffff; color: #07080c; border-color: #ffffff; font-weight: 600; }
.rule-summary {
  padding: 14px 16px;
  border-radius: 12px;
  background: rgba(56, 189, 248, 0.06);
  border: 1px solid rgba(56, 189, 248, 0.2);
  margin-bottom: 14px;
}
.rule-summary h4 { margin: 0 0 8px; font-size: 13.5px; color: #e0f2fe; }
.rule-summary ul { margin: 0; padding-left: 18px; color: var(--text-secondary); font-size: 12.8px; line-height: 1.75; }
.rule-flow { display: flex; flex-direction: column; gap: 10px; }
.rule-step {
  display: flex;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.025);
  border: 1px solid var(--border-subtle);
}
.rule-step.human { border-color: rgba(56, 189, 248, 0.28); background: rgba(56, 189, 248, 0.05); }
.rule-step.fail-gate { border-color: rgba(245, 158, 11, 0.3); background: rgba(245, 158, 11, 0.05); }
.rule-num {
  width: 24px; height: 24px; border-radius: 8px; flex: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
  background: rgba(255, 255, 255, 0.08); color: #fff;
}
.rule-step.human .rule-num { background: rgba(56, 189, 248, 0.22); color: #7dd3fc; }
.rule-step.fail-gate .rule-num { background: rgba(245, 158, 11, 0.22); color: #fcd34d; }
.rule-md {
  padding: 16px 18px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid var(--border-subtle);
  font-size: 13px;
  line-height: 1.75;
  color: var(--text-secondary);
}
.rule-md h1, .rule-md h2, .rule-md h3 { color: #fff; margin: 14px 0 6px; font-size: 14px; }
.rule-md h1 { font-size: 15.5px; margin-top: 0; }
.rule-md ul, .rule-md ol { margin: 6px 0; padding-left: 18px; }
.rule-md blockquote { margin: 8px 0; padding: 8px 12px; border-radius: 8px; background: rgba(255,255,255,0.035); color: var(--text-secondary); }
.rule-md table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 12px; }
.rule-md th, .rule-md td { border: 1px solid var(--border-subtle); padding: 6px 8px; text-align: left; }
.rule-md th { color: #fff; background: rgba(255,255,255,0.04); }

.chk-btn {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  border: 1.5px solid rgba(255, 255, 255, 0.22);
  background: rgba(255, 255, 255, 0.03);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #07080c;
  cursor: pointer;
  padding: 0;
  transition: all 140ms;
}
.chk-btn:hover { border-color: var(--accent-cyan); }
.chk-btn.on { background: var(--accent-cyan); border-color: var(--accent-cyan); }

/* ================= 二级页面通用样式 ================= */
.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin: 12px 0 24px;
  flex-wrap: wrap;
}
.page-head h2 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 4px; }
.page-head p { margin: 0; color: var(--text-secondary); font-size: 13.5px; }

.surface-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 20px 22px;
  margin-bottom: 16px;
}
.surface-card h3 { font-size: 15.5px; font-weight: 600; margin: 0 0 12px; }
.dim { color: var(--text-secondary); font-size: 13px; }

/* 流程总览页 */
.ov-stats {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
@media (max-width: 960px) { .ov-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ov-stat {
  text-align: left;
  padding: 14px 16px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  background: var(--bg-card);
  color: var(--text-primary);
  cursor: pointer;
  transition: all 150ms;
}
.ov-stat:hover { border-color: var(--border-strong); background: var(--bg-elevated); }
.ov-stat.on { border-color: rgba(56, 189, 248, 0.48); background: rgba(56, 189, 248, 0.08); }
.ov-stat.err-hi { border-color: rgba(248, 113, 113, 0.34); background: rgba(248, 113, 113, 0.07); }
.ov-stat .k { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; justify-content: space-between; }
.ov-stat .v { font-size: 24px; font-weight: 650; margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.ov-group {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  margin-bottom: 16px;
  overflow: hidden;
}
.ov-group-hd {
  padding: 13px 18px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-primary);
  background: rgba(255, 255, 255, 0.02);
}
.ov-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 13px 18px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  transition: background 140ms;
}
.ov-row:last-child { border-bottom: none; }
.ov-row:hover { background: rgba(255, 255, 255, 0.028); }
.ov-row-thumb {
  width: 44px;
  height: 54px;
  border-radius: 8px;
  background: #0d1018;
  border: 1px solid var(--border-subtle);
  overflow: hidden;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  cursor: pointer;
}
.ov-row-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ov-row-main { flex: 1; min-width: 0; cursor: pointer; }
.ov-row-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ov-id {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  color: var(--text-muted);
  padding: 1px 6px;
  border-radius: 5px;
  background: rgba(255, 255, 255, 0.05);
}
.ov-row-title { font-size: 14px; font-weight: 600; color: #ffffff; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ov-row-sub { font-size: 12.5px; color: var(--text-secondary); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ov-row-acts { display: flex; align-items: center; gap: 8px; flex: none; }

.asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.asset-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: border-color 160ms, background 160ms;
}
.asset-card:hover { border-color: var(--border-mid); background: var(--bg-card-hover); }
.asset-ic {
  width: 40px;
  height: 40px;
  border-radius: 11px;
  background: var(--accent-cyan-soft);
  color: #7dd3fc;
  display: flex;
  align-items: center;
  justify-content: center;
}
.asset-head { display: flex; align-items: baseline; justify-content: space-between; }
.asset-head b { font-size: 15px; }
.asset-cnt { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 11px 10px; border-bottom: 1px solid var(--border-subtle); text-align: left; vertical-align: middle; }
th { color: var(--text-secondary); font-weight: 500; font-size: 12px; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }

.seg { display: inline-flex; padding: 3px; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 10px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--text-secondary); padding: 5px 13px; border-radius: 7px; font-size: 12.5px; font-weight: 500; cursor: pointer; }
.seg button.on { background: var(--bg-elevated); color: #ffffff; }

.bar { height: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #38bdf8, #818cf8); }

.info-banner {
  background: rgba(56, 189, 248, 0.08);
  border: 1px solid rgba(56, 189, 248, 0.2);
  border-radius: var(--radius-md);
  padding: 13px 16px;
  font-size: 13px;
  color: #bae6fd;
  margin-bottom: 16px;
}

.empty-box {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-secondary);
  background: rgba(19, 23, 34, 0.6);
  border: 1px dashed var(--border-mid);
  border-radius: var(--radius-lg);
}

/* ================= 悬浮批量条、右侧抽屉与弹窗 ================= */
.bulk {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  background: rgba(25, 30, 44, 0.96);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(56, 189, 248, 0.4);
  border-radius: var(--radius-pill);
  padding: 8px 12px 8px 18px;
  display: none;
  gap: 10px;
  align-items: center;
  z-index: 25;
  box-shadow: var(--shadow-float);
}

#mask {
  position: fixed;
  inset: 0;
  background: rgba(4, 6, 10, 0.72);
  backdrop-filter: blur(5px);
  display: none;
  z-index: 30;
}
#drawer {
  position: fixed;
  top: 12px;
  right: 12px;
  bottom: 12px;
  width: min(720px, calc(100vw - 24px));
  background: #10131d;
  border: 1px solid var(--border-mid);
  border-radius: 20px;
  z-index: 31;
  transform: translateX(calc(100% + 24px));
  transition: transform 220ms var(--ease-out);
  overflow-y: auto;
  padding: 24px 28px 64px;
  box-shadow: var(--shadow-float);
}
#drawer.open { transform: none; }

.dh {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  justify-content: space-between;
  padding-bottom: 18px;
  margin-bottom: 20px;
  border-bottom: 1px solid var(--border-subtle);
}
.dh h2 { flex: 1; font-size: 18px; font-weight: 600; margin: 0; line-height: 1.4; }

.task-panel {
  background: #171b29;
  border: 1px solid var(--border-subtle);
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 16px;
}
.task-panel.me { border-color: rgba(56, 189, 248, 0.34); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06); }
.task-panel.err { border-color: rgba(248, 113, 113, 0.36); background: rgba(36, 18, 24, 0.75); }
.task-lead { font-weight: 600; font-size: 15.5px; margin-bottom: 10px; color: #ffffff; display: flex; align-items: center; gap: 8px; }

.callout {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border-subtle);
  padding: 11px 14px;
  border-radius: 10px;
  margin: 10px 0;
  font-size: 13px;
  white-space: pre-wrap;
}
.callout.re { background: rgba(167, 139, 250, 0.09); border-color: rgba(167, 139, 250, 0.26); color: #ddd6fe; }
.callout.warn { background: rgba(251, 191, 36, 0.09); border-color: rgba(251, 191, 36, 0.26); color: #fde68a; }

video { width: 100%; background: #000; border-radius: 12px; max-height: 420px; border: 1px solid var(--border-subtle); }
.v916 { max-width: 280px; }

.covers { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 12px; margin-top: 12px; }
.cov {
  background: var(--bg-input);
  border: 1.5px solid var(--border-subtle);
  border-radius: 12px;
  padding: 8px;
  text-align: center;
  cursor: pointer;
  transition: all 150ms;
}
.cov:hover { border-color: var(--border-strong); transform: translateY(-1px); }
.cov.sel { border-color: var(--accent-cyan); background: rgba(56, 189, 248, 0.09); box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.25); }
.cov img { width: 100%; aspect-ratio: 3 / 4; height: auto; object-fit: contain; background: #07090e; border-radius: 8px; display: block; }
.cov.land img { aspect-ratio: 4 / 3; }
.cov.small img { height: 116px; aspect-ratio: auto; }
.cov .dim { margin-top: 7px; font-size: 12px; display: flex; align-items: center; justify-content: space-between; padding: 0 2px; }

/* 顶部智能任务指挥舱 */
.mission-panel {
  padding: 18px 22px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: radial-gradient(75% 120% at 15% 0%, rgba(56, 189, 248, 0.11), transparent 65%);
}
.mission-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 10px;
  background: rgba(52, 211, 153, 0.09);
  border: 1px solid rgba(52, 211, 153, 0.24);
  font-size: 12.5px;
  color: #a7f3d0;
}
.mission-banner.warn {
  background: rgba(251, 191, 36, 0.1);
  border-color: rgba(251, 191, 36, 0.28);
  color: #fde68a;
}
.mission-main { display: flex; align-items: center; gap: 16px; }
.mission-thumb {
  width: 68px;
  height: 90px;
  border-radius: 11px;
  overflow: hidden;
  border: 1px solid var(--border-mid);
  background: #0b0e16;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
}
.mission-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mission-copy { flex: 1; min-width: 0; }
.mission-eyebrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
.mission-title { font-size: 16.5px; font-weight: 650; color: #ffffff; line-height: 1.35; }
.mission-hint { font-size: 13px; color: var(--text-secondary); margin-top: 4px; line-height: 1.55; }
.mission-steps {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
  padding-top: 2px;
}
.mstep {
  font-size: 11.5px;
  padding: 3px 9px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border-subtle);
  color: var(--text-muted);
}
.mstep.done { color: #6ee7b7; border-color: rgba(52, 211, 153, 0.24); background: rgba(52, 211, 153, 0.08); }
.mstep.now { color: #ffffff; font-weight: 600; border-color: rgba(56, 189, 248, 0.55); background: rgba(56, 189, 248, 0.18); }

.cs-mode-tabs {
  display: inline-flex;
  padding: 3px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.04);

  gap: 3px;
  margin-bottom: 14px;
}
.cs-mode-btn {
  border: 0;
  background: transparent;
  color: var(--text-secondary);
  padding: 6px 14px;
  border-radius: 7px;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all 140ms;
}
.cs-mode-btn.on { background: #ffffff; color: #07080c; font-weight: 600; }
.cs-stage-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  background: #080a10;
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
}
.cs-canvas {
  max-width: 100%;
  max-height: 360px;
  border-radius: 10px;

  cursor: grab;
  touch-action: none;
}
.cs-canvas:active { cursor: grabbing; }
.cs-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.cs-pill {

  font-size: 12px;
  cursor: pointer;
  transition: all 140ms;
}
.cs-pill:hover { color: #fff; border-color: var(--border-strong); }

.cs-slider-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }

.cs-slider-row input[type=range] { flex: 1; accent-color: #38bdf8; }
.cs-slider-row span { font-size: 11.5px; color: var(--text-muted); width: 42px; text-align: right; font-variant-numeric: tabular-nums; }

label.f { display: block; font-size: 12.5px; font-weight: 500; color: var(--text-secondary); margin: 14px 0 6px; }
input[type="text"], input:not([type]), textarea {

  border-radius: 10px;
  padding: 9px 12px;
  font-size: 13.5px;
}
textarea { min-height: 74px; resize: vertical; }
input:focus, textarea:focus { outline: none; border-color: rgba(56, 189, 248, 0.5); }

.tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }

.cand { display: flex; gap: 8px; align-items: center; padding: 7px 9px; border-radius: 8px; background: rgba(255, 255, 255, 0.03); margin: 5px 0; font-size: 13px; }

.plat-sec { border-top: 1px solid var(--border-subtle); padding-top: 14px; margin-top: 14px; }

.plats { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.pf { font-size: 11px; padding: 1px 7px; border-radius: 5px; background: rgba(255, 255, 255, 0.06); color: var(--text-secondary); }
.pf.ok { background: var(--accent-emerald-soft); color: #6ee7b7; }

.pf.ai { background: rgba(129, 140, 248, 0.15); color: #a5b4fc; }
.pf.err { background: var(--accent-coral-soft); color: #fca5a5; }

details { margin-top: 12px; }
summary { cursor: pointer; color: var(--text-secondary); font-size: 13px; font-weight: 500; padding: 4px 0; }
.md { white-space: pre-wrap; font-size: 13.5px; line-height: 1.7; background: var(--bg-input); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 16px; max-height: 68vh; overflow: auto; }

.opt-card b { font-size: 13.5px; display: flex; align-items: center; justify-content: space-between; }

#modal { position: fixed; inset: 0; background: rgba(4, 6, 10, 0.74); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 50; }
#modal .box { background: #151926; border: 1px solid var(--border-mid); border-radius: 18px; padding: 24px; width: min(460px, 92vw); box-shadow: var(--shadow-float); }
#modal h3 { font-size: 17px; margin: 0 0 10px; }

#toast { position: fixed; right: 24px; bottom: 24px; max-width: 420px; background: rgba(22, 26, 39, 0.96); backdrop-filter: blur(10px); border: 1px solid var(--border-mid); padding: 12px 16px; border-radius: 12px; display: none; white-space: pre-wrap; z-index: 60; font-size: 13px; box-shadow: var(--shadow-float); }

function pubCol(p, k) {
  if (p.状态 === "需人工") { const b = p.之前; return b === "待发布" || b === "已定时" ? "pub" : b === "已发布" ? "data" : "auth"; }
  if (p.状态 === "草稿") { if (!p.封面竖文件) return (k.封面候选 || []).length ? "coverpick" : "cover"; if (!p.封面横文件) return "cover"; return "auth"; }
  if (p.状态 === "待发布" || p.状态 === "已定时") return "pub";
  if (p.状态 === "已发布") return "data";
  return null;
}

function clipCol(k, ps) {
  const b = k.之前;
  if (k.状态 === "候选") return "pick";
  if (k.状态 === "放弃") return "off";
  if (k.状态 === "待剪" || k.状态 === "剪辑中") return "cut";
  if (k.状态 === "已剪辑") return "review";
  if (k.状态 === "需人工") return b === "候选" ? "pick" : b === "已剪辑" ? "review" : "cut";
  const act = activePubs(ps);
  if (ps.length && !act.length) return "off";
  const plats = S.配置.发布平台 || [];
  if (!act.length || plats.some(pl => !ps.some(p => p.平台 === pl))) return "copy";
  return act.map(p => pubCol(p, k)).filter(Boolean).sort((a, b) => CI[a] - CI[b])[0] || "data";
}

function running(ids) { return !!(L && L.在干活 && (L.对象 || []).some(o => ids.includes(o))); }

function items() {
  const out = [];
  for (const f of S.收件 || []) {
    const col = f.状态 === "整理中" ? "sort" : "inbox";
    out.push({
      type: "file", id: "file:" + f.文件, ids: [f.文件], title: f.文件, col, phase: COLS[CI[col]][4], f,
      state: col === "sort" ? "run" : "queue",
      label: col === "sort" ? "整理中" : "新录像待整理"
    });
  }
  for (const s of S.素材) {
    const n = S.切片.filter(k => k.source_id === s.source_id).length;
    let col;
    if (s.状态 === "待整理") col = "sort";
    else if (s.状态 === "已整理") col = "recap";
    else if (s.状态 === "需人工") col = s.之前 === "待整理" ? "sort" : "recap";
    else if (s.状态 === "已复盘" && !n) col = "recap";
    else continue;
    const err = s.状态 === "需人工", run = running([s.source_id]), doneNoClip = s.状态 === "已复盘" && !n;
    const label = err
      ? "需处理"
      : run
      ? (col === "sort" ? "AI 整理归档中" : "AI 转写复盘中")
      : doneNoClip
      ? "未通过筛选 · 0条合格"
      : (col === "sort" ? "排队整理" : "排队转写复盘");
    out.push({
      type: "source", id: s.source_id, ids: [s.source_id], title: s.标题 || s.source_id, col, phase: COLS[CI[col]][4], s, objs: [s],
      state: err ? "err" : run ? "run" : doneNoClip ? "fail" : "queue",
      label
    });
  }
  for (const k of S.切片) {
    const ps = pubsOf(k.clip_id), col = clipCol(k, ps), ids = [k.clip_id, ...ps.map(p => p.publish_id)];
    const objs = [k, ...ps], errP = ps.filter(p => p.状态 === "需人工"), err = k.状态 === "需人工" || errP.length > 0, run = running(ids);
    const me = COLS[CI[col]] && COLS[CI[col]][3] === "me" && !gateOn(col);
    let label;
    if (col === "off") label = k.状态 === "放弃" ? "已放弃" : "不发布";
    else if (err) label = "需处理";
    else if (me) label = COLS[CI[col]][2];
    else if (col === "pub") {
      const t = activePubs(ps).filter(p => p.状态 === "已定时").map(p => p.发布时间).sort()[0];
      label = activePubs(ps).some(p => p.状态 === "待发布") ? "待设定时" : t ? "定时 " + hm(t) : "已定时";
    } else if (col === "data") label = "已发布";
    else label = COLS[CI[col]][2];
    out.push({
      type: "clip", id: k.clip_id, ids, title: k.标题, col, phase: col === "off" ? "off" : COLS[CI[col]][4], k, ps, objs, errP,
      state: col === "off" ? "off" : err ? "err" : me ? "me" : run ? "run" : ["pub", "data"].includes(col) && !activePubs(ps).some(p => p.状态 === "待发布") ? "ok" : "queue",
      label
    });
  }
  return out;
}

async function uploadVideos(fileList) {
  const files = Array.from(fileList || []).filter(Boolean);
  if (!files.length) return;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (!/\.(mp4|mov|mkv|m4v)$/i.test(f.name)) {
      toast(`不支持的文件格式：${f.name}（仅支持 mp4 / mov / mkv / m4v）`, false);
      continue;
    }
    const ok = await new Promise(resolve => {
      const xhr = new XMLHttpRequest();
      xhr.open("POST", "/api/upload?name=" + encodeURIComponent(f.name));
      xhr.upload.onprogress = e => {
        if (e.lengthComputable) {
          const pct = Math.round((e.loaded * 100) / e.total);
          uploadMsg = `正在导入 ${f.name} (${pct}%)…`;
          const el = $("#dock-live-title");
          if (el) el.textContent = uploadMsg;
        }
      };
      xhr.onload = () => {
        uploadMsg = "";
        try {
          const j = JSON.parse(xhr.responseText || "{}");
          if (xhr.status === 200 && j.成功) { toast(j.输出 || `已导入 ${f.name}`); resolve(true); }
          else { toast(j.输出 || "导入失败", false); resolve(false); }
        } catch (err) { toast("导入失败", false); resolve(false); }
      };
      xhr.onerror = () => { uploadMsg = ""; toast("无法连接本地工作台服务 (请确认访问 http://127.0.0.1:8765/)", false); resolve(false); };
      xhr.send(f);
    });
    if (!ok) break;
  }
  await load();
  pollLive();
}

function bindDockDrop() {
  const dock = $("#creation-dock");
  if (!dock) return;
  dock.ondragover = e => { e.preventDefault(); dock.classList.add("drag-over"); };
  dock.ondragleave = e => { if (!dock.contains(e.relatedTarget)) dock.classList.remove("drag-over"); };
  dock.ondrop = e => { e.preventDefault(); dock.classList.remove("drag-over"); if (e.dataTransfer.files.length) uploadVideos(e.dataTransfer.files); };
}

}

  modal("从待处理队列移出该视频？", `视频 <b>${esc(name)}</b> 将移至本地 <code>待加工/已移出/</code> 文件夹妥善保留，绝不删除原文件。`, "确认移出", () => act({ 动作: "移出待加工", 文件: name }, "已移出待处理队列"));
}

function renderFeedOnly() {
  const box = $("#feed-body");
  if (box) box.innerHTML = renderFeedContent();
}

function go(p) {
  page = p;
  location.hash = p;
  render();
  $("main").scrollTop = 0;
}

/* ================= 核心页面 1: 开始创作 (三层清晰结构) ================= */
function clickStudioGate(col) {
  const waiting = items().filter(x => x.col === col && (x.state === "me" || x.state === "err"));
  if (waiting.length === 1) {
    openItem(waiting[0].type, waiting[0].id);
    return;
  }
  feedTab = "todo";
  gateFilter = gateFilter === col ? "" : col;
  render();
}

function switchFeedTab(t) {
  feedTab = t;
  gateFilter = "";
  render();
}

function board() {
  const all = items();
  const active = all.filter(x => x.state !== "off" && x.state !== "fail");
  const failed = all.filter(x => x.state === "fail" || x.state === "off");
  const mine = active.filter(x => x.state === "me" || x.state === "err");
  const aiQueue = active.filter(x => ["queue", "run", "wait"].includes(x.state));
  const published = active.filter(x => x.state === "ok");
  const inboxN = (S.收件 || []).length;
  const auto = (S.自动处理 || {}).开启;

  // 智能聚焦标签：绝不把用户留在空的「AI 处理队列 0」看着空白发呆
  if (feedTab === "ai" && !aiQueue.length && mine.length) {
    feedTab = "todo";
  }
  if (feedTab === "todo" && !mine.length && (active.length || failed.length)) {
    if (aiQueue.length) feedTab = "ai";
    else if (published.length) feedTab = "pub";
    else if (failed.length) feedTab = "fail";
  }

  const isLocal = Boolean(S.项目路径);
  const busyNow = !!(L && L.在干活) || Boolean(aiStarting);
  const nextAi = L && L.下一步;
  const canRunAi = !busyNow && (inboxN > 0 || Boolean(nextAi));
  const runStartMs = (L && L.在干活 && L.开始) ? new Date(L.开始).getTime() : (aiStarting ? aiStarting.startedAt : Date.now());
  const elapsedSec = Math.max(0, Math.floor((Date.now() - runStartMs) / 1000));
  const activeStage = (L && L.在干活 && L.环节) || "";
  const activeDesc = (L && L.在干活) ? (L.说明 || "AI 正在处理视频") : (aiStarting ? aiStarting.label : "");
  const liveLine = (L && L.在干活)
    ? (L.实时进度 || ((L.最近几步 && L.最近几步.length) ? L.最近几步[L.最近几步.length - 1].内容 : `正在处理 ${(L.对象 || []).join("、") || "当前视频"}…`))
    : "正在启动本机任务脚本与模型引擎，请稍候…";
  const stepOrder = [
    ["0-整理", "整理归档"],
    ["1-复盘选片", "转写与选片"],
    ["2-剪辑", "竖屏剪辑"],
    ["4-文案", "文案与封面"],
    ["6-发布", "定时发布"]
  ];

  // 挑出此刻最优先需要用户处理的焦点任务（优先人类关卡：确认发布 > 选封面 > 看成片 > 挑片段 > 需处理）
  const gateRank = { auth: 1, coverpick: 2, review: 3, pick: 4 };
  const focusItem = mine.length
    ? [...mine].sort((a, b) => ((a.state === "me" ? gateRank[a.col] || 5 : 9) - (b.state === "me" ? gateRank[b.col] || 5 : 9)))[0]
    : null;
  const fullChain = ["整理", "转写选片", "挑片段", "剪辑成片", "看成片", "文案&封面", "选封面", "确认发布"];
  const colToChainIdx = { inbox: 0, sort: 0, recap: 1, pick: 2, cut: 3, review: 4, copy: 5, cover: 5, coverpick: 6, auth: 7, pub: 8, data: 8 };
  const focusStepIdx = focusItem ? (colToChainIdx[focusItem.col] ?? 1) : 0;
  const focusGuide = {
    pick: { done: "AI 已完成转写并拆出高光候选", next: "勾选想剪的片段并确认，AI 将自动执行竖屏精剪", cta: "立即去挑片段 →" },
    review: { done: "AI 已完成竖屏精剪与字幕包装", next: "预览成片点「通过」，通过后 AI 将自动撰写爆款文案并生成封面", cta: "立即去看成片 →" },
    coverpick: { done: "AI 已写好标题文案并生成 3 张候选封面", next: "选一张封面（或在封面工坊改字/换比例/裁剪），选定后进入最终定时发布", cta: "立即去选封面 →" },
    auth: { done: "成片、文案与横竖版封面已全部就绪", next: "核对标题并点击确认，系统将设为定时发布（绝不立即发）", cta: "立即确认发布 →" }
  };
  const focusMeta = focusItem
    ? (focusItem.state === "err"
        ? { done: "上一环节未达标或中断", next: "点开可查看具体原因，支持重试、放弃或直接从 SQLite 移除", cta: "立即去处理 →" }
        : (focusGuide[focusItem.col] || { done: "上一环节已完成", next: "点开完成本步审核即可自动推进到下一阶段", cta: "立即处理 →" }))
    : null;
  const focusThumb = focusItem
    ? ((focusItem.type === "clip" && ((focusItem.k.封面候选 && focusItem.k.封面候选[0] && file(focusItem.k.封面候选[0])) || focusItem.k.视频缩略图))
      || (focusItem.type === "source" && focusItem.s.视频缩略图) || "")
    : "";

  const dockTitle = uploadMsg
    ? uploadMsg
    : busyNow
    ? activeDesc
    : inboxN
    ? `发现 ${inboxN} 个新录像可开始处理`
    : nextAi
    ? `轮到 AI 自动执行：${nextAi.说明}`
    : "导入原始长录像开始创作";

  const dockSummary = busyNow
    ? `正在本机后台处理 ${(L && L.对象 && L.对象[0]) || "当前视频"}，完成后会自动通知你并切换到下一步。`
    : inboxN
    ? `视频已进入本地「待加工」目录，点击右侧「立即运行 AI 处理」即可开始无损整理与语音转写。`
    : nextAi
    ? `你的上一步拍板已生效！点击右侧白色主按钮，AI 将自动执行「${esc(nextAi.说明)}」（对象：${esc((nextAi.对象 || []).join("、"))}）。`
    : `支持拖拽视频、点击选择，或在访达复制视频后直接按 <span class="kbd">⌘V</span> 粘贴进来，数据直存本机 SQLite。`;

  return `
    ${!isLocal ? `<div class="info-banner" style="display:flex;align-items:center;justify-content:space-between;gap:12px">
      <span>当前打开的是云端静态页面。你的 SQLite 数据库与剪辑引擎运行在 Mac 本机，请打开本地地址正式使用。</span>
      <a class="btn sm pri" href="http://127.0.0.1:8765/" style="text-decoration:none">打开本机 127.0.0.1:8765</a>
    </div>` : ""}

    <!-- 第一层：核心导入操作舱 (一眼看懂怎么开始) -->
    <section class="hero-stage">
      <h1 class="hero-headline">把一场长录像，变成多条竖屏短视频</h1>
      <div class="how-steps">
        <span class="how-step"><span class="how-num">1</span> 放入长录像</span>
        <span class="how-arrow">→</span>
        <span class="how-step"><span class="how-num">2</span> AI 自动拆条 · 剪辑 · 做封面</span>
        <span class="how-arrow">→</span>
        <span class="how-step"><span class="how-num">3</span> 你点选拍板 · 定时发抖音</span>
      </div>

      <div class="creation-dock" id="creation-dock">
        <input type="file" id="vid-picker" accept=".mp4,.mov,.mkv,.m4v,video/*" multiple style="display:none" onchange="uploadVideos(this.files);this.value=''">
        ${busyNow ? `
          <div class="ai-run-panel">
            <div class="ai-run-top">
              <div class="ai-orb"><span class="ai-orb-core"></span></div>
              <div class="ai-run-copy">
                <div class="ai-run-head">
                  <div class="ai-run-title">${esc(activeDesc)}</div>
                  <span class="ai-run-timer" id="ai-elapsed">已运行 ${esc(fmtClock(elapsedSec) || "00:00")}</span>
                </div>
                <div class="ai-run-log" id="ai-live-line">${esc(liveLine)}</div>
              </div>
            </div>
            <div class="ai-shimmer-track"><div class="ai-shimmer-bar"></div></div>
            <div class="ai-run-steps">
              ${stepOrder.map(([st, nm]) => {
                const isNow = activeStage === st || (st === "4-文案" && activeStage === "5-封面");
                return `<span class="ai-step-tag ${isNow ? "now" : ""}">${isNow ? '<span class="dot busy"></span>' : ""}${esc(nm)}</span>`;
              }).join("")}
            </div>
          </div>
        ` : inboxN > 0 ? `
          <div class="dock-selected-wrap">
            <div class="dock-sel-hd">
              <div class="dock-sel-title">
                <span class="dot idle"></span>
                <span id="dock-live-title">${esc(uploadMsg || `已选入 ${inboxN} 个长录像，随时可启动 AI 拆条`)}</span>
              </div>
              <span class="dim" style="font-size:12px">点击封面可试看 · 支持 <span class="kbd">⌘V</span> 粘贴</span>
            </div>
            <div class="dock-sel-grid">
              ${(S.收件 || []).map(f => `
                <div class="sel-vid-card" onclick="openItem('file','file:${esc(f.文件)}')" title="点击试看 ${esc(f.文件)}">
                  <div class="sel-vid-thumb">
                    ${f.缩略图 ? `<img src="${esc(f.缩略图)}" alt="${esc(f.文件)}">` : ""}
                    <span class="sel-play-btn">${ic("play", 13)}</span>
                    <button class="sel-rm-btn" title="移出队列（保留原文件）" onclick="event.stopPropagation();removeInboxVideo('${esc(f.文件)}')">${ic("x", 12)}</button>
                    ${f.时长秒 ? `<span class="sel-dur-tag">${esc(fmtClock(f.时长秒))}</span>` : ""}
                  </div>
                  <div class="sel-vid-info">
                    <div class="sel-vid-name">${esc(f.文件)}</div>
                    <div class="sel-vid-meta num">
                      <span>${f.大小MB} MB</span>
                      <span>${f.分辨率 ? esc(f.分辨率.split("×")[1] + "p") : (f.状态 === "整理中" ? "整理中" : "已就绪")}</span>
                    </div>
                  </div>
                </div>
              `).join("")}
              <button class="sel-add-tile" onclick="triggerVideoPicker()" title="继续添加或按 ⌘V 粘贴视频">
                ${ic("plus", 18)}
                <span>继续添加</span>
              </button>
            </div>
          </div>
        ` : focusItem ? `
          <div class="mission-panel">
            <div class="mission-banner ${focusItem.state === "err" ? "warn" : ""}">
              <span>${focusItem.state === "err" ? "⚠ 有任务需要你决定处理方式" : `✓ ${esc(focusMeta.done)}`}</span>
              <span style="opacity:0.85">共 ${mine.length} 项待你拍板</span>
            </div>
            <div class="mission-main">
              <div class="mission-thumb">
                ${focusThumb ? `<img src="${esc(focusThumb)}" alt="">` : ic("film", 22)}
              </div>
              <div class="mission-copy">
                <div class="mission-eyebrow">
                  <span class="pill ${focusItem.state === "err" ? "err" : "me"}">当前步骤：${esc(focusItem.label)}</span>
                  <span class="dim" style="font-size:12px">${esc(focusItem.id)}</span>
                </div>
                <div class="mission-title">${esc(focusItem.title)}</div>
                <div class="mission-hint"><b>下一步该做什么：</b>${esc(focusMeta.next)}</div>
              </div>
            </div>
            <div class="mission-steps">
              ${fullChain.map((nm, idx) => {
                const cls = idx < focusStepIdx ? "done" : idx === focusStepIdx ? "now" : "";
                return `<span class="mstep ${cls}">${idx < focusStepIdx ? "✓ " : idx === focusStepIdx ? "● " : ""}${esc(nm)}</span>`;
              }).join("")}
            </div>
          </div>
        ` : `
          <div class="dock-main">
            <div class="dock-upload-tile" onclick="triggerVideoPicker()" title="点击选择本地视频文件，或拖拽 / ⌘V 粘贴视频">
              ${ic("plus", 22)}
              <span>放录像</span>
            </div>
            <div class="dock-copy">
              <div class="dock-title" id="dock-live-title">${esc(dockTitle)}</div>
              <div class="dock-desc">${dockSummary}</div>
            </div>
          </div>
        `}
        <div class="dock-bar">
          <div class="dock-chips">
            <button class="dock-chip" onclick="openSettings()">${ic("spark", 13)} 驱动：${esc(S.配置.驱动AI || "Pi")}</button>
            <button class="dock-chip" onclick="openSettings()">${ic("scissors", 13)} 剪辑：${esc(S.配置.剪辑工具 || "ffmpeg")}</button>
            <span class="dock-chip static">9:16 竖屏 · ${esc((S.配置.成片时长 || [60, 90]).join("–"))}s</span>
            <button class="dock-chip" onclick="pasteFromClipboard()" title="把访达里 ⌘C 复制的视频直接粘贴进来">⌘V 粘贴视频</button>
            ${focusItem && !inboxN ? `<button class="dock-chip" onclick="triggerVideoPicker()">+ 导入新录像</button>` : ""}
          </div>
          <div class="btns">
            <button class="btn sm" onclick="openFolder('待加工')" title="超大原片可直接拖入访达文件夹">${ic("folder", 14)} 打开待加工目录</button>
            ${busyNow
              ? `<button class="btn pill-cta" disabled><span class="dot busy"></span> AI 处理中…</button>`
              : focusItem && !inboxN
              ? `<button class="btn pill-cta pri" onclick="openItem('${focusItem.type}','${esc(focusItem.id)}')">${esc(focusMeta.cta)}</button>`
              : canRunAi
              ? `<button class="btn pill-cta pri" onclick="runAiNow()">${ic("play", 14)} ${nextAi && !inboxN ? `启动 AI：${esc(nextAi.说明)}` : "立即运行 AI 处理"}</button>`
              : `<button class="btn pill-cta pri" onclick="triggerVideoPicker()">${ic("plus", 15)} 选择视频导入</button>`
            }
          </div>
        </div>
      </div>
    </section>

    <!-- 第二层：4 个人工拍板关卡视觉入口 (强层次感、一点即达) -->
    <div class="studio-sec-hd">
      <h3>你只需要拍板这 4 步</h3>
      <span>其余整理、转写、初剪、写文案与生图均由 AI 自动完成</span>
    </div>
    <div class="studio-grid">
      ${STUDIO_GATES.map(g => {
        const cnt = active.filter(x => x.col === g.col && (x.state === "me" || x.state === "err")).length;
        const selected = gateFilter === g.col;
        return `<button class="studio-card ${g.color} ${cnt > 0 || selected ? "active-gate" : ""}" onclick="clickStudioGate('${g.col}')">
          <div class="studio-art">${STUDIO_ART[g.col]}</div>
          <div class="studio-info">
            <div class="studio-top">
              <span class="studio-name">${esc(g.title)}</span>
              <span class="studio-badge ${cnt ? "" : "zero"}">${cnt ? `${cnt} 待办` : "0"}</span>
            </div>
            <div class="studio-sub">${esc(g.desc)}</div>
          </div>
        </button>`;
      }).join("")}
    </div>

    <!-- 第三层：分类切换栏 + 搜索 + 极简图文任务列表 -->
    <div class="feed-bar">
      <div class="feed-tabs">
        <button class="feed-tab ${feedTab === "todo" ? "on" : ""}" onclick="switchFeedTab('todo')">
          待你拍板 <span class="cnt">${mine.length}</span>
        </button>
        <button class="feed-tab ${feedTab === "ai" ? "on" : ""}" onclick="switchFeedTab('ai')">
          AI 处理队列 <span class="cnt">${aiQueue.length}</span>
        </button>
        <button class="feed-tab ${feedTab === "pub" ? "on" : ""}" onclick="switchFeedTab('pub')">
          合格与发布 <span class="cnt">${published.length}</span>
        </button>
        <button class="feed-tab ${feedTab === "fail" ? "on" : ""}" onclick="switchFeedTab('fail')">
          不合格 / 未通过 <span class="cnt">${failed.length}</span>
        </button>
        <button class="feed-tab ${feedTab === "overview" ? "on" : ""}" onclick="switchFeedTab('overview')">
          阶段看板 <span class="cnt">${active.length}</span>
        </button>
      </div>
      <div class="search-box">
        <span class="s-ic">${ic("search", 14)}</span>
        <input id="search-inp" type="text" placeholder="搜索视频标题…">
      </div>
    </div>

    <div id="feed-body">${renderFeedContent()}</div>
  `;
}

function renderFeedContent() {
  const q = searchQ.trim().toLowerCase();
  const match = x => !q || String(x.title || "").toLowerCase().includes(q) || String((x.k && x.k.开头钩子) || "").toLowerCase().includes(q);
  const all = items().filter(match);
  const active = all.filter(x => x.state !== "off" && x.state !== "fail");

  if (feedTab === "overview") {
    return `<div class="macro-board">
      ${PHASES.map(ph => {
        const list = active.filter(x => x.phase === ph.id);
        return `<div class="phase-col">
          <div class="phase-hd"><span>${esc(ph.name)}</span><span class="dim num">${list.length}</span></div>
          ${list.length ? list.map(miniCard).join("") : `<div class="dim" style="text-align:center;padding:28px 0;font-size:12.5px">暂无内容</div>`}
        </div>`;
      }).join("")}
    </div>`;
  }

  let list = [];
  if (feedTab === "todo") {
    list = active.filter(x => (x.state === "me" || x.state === "err") && (!gateFilter || x.col === gateFilter));
  } else if (feedTab === "ai") {
    list = active.filter(x => ["queue", "run", "wait"].includes(x.state));
  } else if (feedTab === "pub") {
    list = active.filter(x => x.state === "ok");
  } else if (feedTab === "fail" || feedTab === "off") {
    list = all.filter(x => x.state === "fail" || x.state === "off");
  }

  if (!list.length) {
    if (feedTab === "todo" && !items().filter(x => x.state !== "off").length) {
      return `<div class="empty-box">
        <div style="font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:6px">本地数据库当前为空，随时可以开始第一条视频</div>
        <div style="margin-bottom:18px">点击上方「选择视频导入」（或将长视频拖入「待加工」文件夹），所有素材、切片、文案与数据都将直接保存在本机 <code>data/sop.db</code>。</div>
        <div class="btns" style="justify-content:center">
          <button class="btn pill-cta pri" onclick="triggerVideoPicker()">${ic("plus", 15)} 选择本地视频导入</button>
          <button class="btn pill-cta" onclick="openFolder('待加工')">${ic("folder", 14)} 在访达打开「待加工」</button>
        </div>
      </div>`;
    }
    return `<div class="empty-box">当前分类下没有匹配的任务${gateFilter ? ` · <a onclick="gateFilter='';render()">清除关卡筛选</a>` : ""}</div>`;
  }

  return `<div class="media-grid">${list.map(mediaCard).join("")}</div>`;
}

function mediaCard(x) {
  const canPick = x.col === "pick" && x.state === "me" && x.type === "clip";
  const isPicked = picked.has(x.id);
  const pillCls = { me: "me", err: "err", run: "run", queue: "", ok: "ok", fail: "fail", off: "fail" }[x.state] || "";
  const gateDef = STUDIO_GATES.find(g => g.col === x.col);

  let durText = "";
  let thumbImg = null;
  let isDirectThumbUrl = false;
  if (x.type === "clip") {
    const k = x.k;
    durText = k.成片时长_秒 ? Math.round(k.成片时长_秒) + "s" : Math.round((k.预览.止 || 0) - (k.预览.起 || 0)) + "s";
    const pubWithCover = (x.ps || []).find(p => p.封面竖文件);
    const covPath = (pubWithCover && pubWithCover.封面竖文件) || (k.封面候选 && k.封面候选[0]) || null;
    if (covPath) { thumbImg = file(covPath); }
    else if (k.视频缩略图) { thumbImg = k.视频缩略图; isDirectThumbUrl = true; }
  } else if (x.type === "file") {
    durText = x.f.时长秒 ? fmtClock(x.f.时长秒) : x.f.大小MB + "M";
    if (x.f.缩略图) { thumbImg = x.f.缩略图; isDirectThumbUrl = true; }
  } else if (x.type === "source") {
    durText = x.s.时长 || "";
    if (x.s.缩略图) { thumbImg = x.s.缩略图; isDirectThumbUrl = true; }
  }

  let subLine = "";
  if (x.state === "err") {
    subLine = (x.k && x.k.原因) || (x.s && x.s.原因) || "执行暂停，点击查看原因并继续";
  } else if (x.type === "clip") {
    const k = x.k;
    const pubDone = (x.ps || []).find(p => p.数据 && (p.数据["72h"] || p.数据["24h"]));
    if (pubDone) {
      const m = pubDone.数据["72h"] || pubDone.数据["24h"];
      subLine = `播放 ${fmt(m.播放)} · 完播 ${fmt(m.完播率, 1)} · 点赞 ${fmt(m.点赞)}`;
    } else if (k.重剪次数 > 0 && k.打回原因 && ["cut", "review"].includes(x.col)) {
      subLine = `修改意见：${k.打回原因}`;
    } else {
      subLine = k.开头钩子 || k.概要 || "";
    }
  } else if (x.type === "file") {
    subLine = "位于「待加工」目录，等待无损整理归档";
  } else if (x.type === "source") {
    subLine = x.s.摘要 || `${x.s.来源} · ${x.s.日期}`;
  }

  const ctaLabel = x.state === "err" ? "去处理" : x.state === "fail" ? "查看原因" : (x.state === "me" && gateDef) ? gateDef.cta : "查看";

  return `<div class="mcard ${x.state === "run" ? "running-card" : x.state === "me" ? "me" : x.state === "err" ? "err" : x.state === "fail" ? "fail" : ""} ${flashId === x.id ? "flash" : ""}" onclick="openItem('${x.type}','${esc(x.id)}')">
    <div class="mthumb">
      ${thumbImg ? `<img src="${esc(thumbImg)}" alt="">` : ic(COLS[CI[x.col]] ? COLS[CI[x.col]][1] : "film", 22)}
      ${durText ? `<span class="mthumb-dur">${esc(durText)}</span>` : ""}
    </div>
    <div class="mbody">
      <div class="mtop">
        <span class="pill ${pillCls}">${x.state === "run" ? '<span class="dot busy"></span>' : ""}${esc(x.label)}</span>
        ${x.type === "clip" && x.k.重剪次数 > 0 && ["cut", "review"].includes(x.col) ? `<span class="pill re">第 ${x.k.重剪次数 + 1} 版</span>` : ""}
      </div>
      <div class="mtitle">${esc(x.title)}</div>
      ${subLine ? `<div class="msub">${esc(subLine)}</div>` : ""}
    </div>
    <div class="mact">
      ${canPick ? `<button class="chk-btn ${isPicked ? "on" : ""}" title="勾选批量操作" onclick="event.stopPropagation();togglePick('${esc(x.id)}',${!isPicked})">${isPicked ? ic("check", 13) : ""}</button>` : ""}
      <button class="btn sm ${x.state === "me" ? "pri" : x.state === "err" ? "bad" : ""}">${esc(ctaLabel)}</button>
    </div>
  </div>`;
}

function miniCard(x) {
  const pillCls = { me: "me", err: "err", run: "run", ok: "ok" }[x.state] || "";
  return `<div class="mini-card ${x.state === "me" ? "me" : ""}" onclick="openItem('${x.type}','${esc(x.id)}')">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:6px">
      <span class="pill ${pillCls}">${esc(x.label)}</span>
      ${x.type === "clip" && x.k.成片时长_秒 ? `<span class="dim num" style="font-size:11px">${Math.round(x.k.成片时长_秒)}s</span>` : ""}
    </div>
    <div class="mt">${esc(x.title)}</div>
  </div>`;
}

function platBadge(p) {
  const st = p.状态;
  const c = st === "需人工" ? "err" : st === "已发布" || st === "已定时" ? "ok" : st === "待发布" ? "ai" : st === "草稿" ? "me" : "";
  return `<span class="pf ${c}">${esc(p.平台)} · ${esc(st)}</span>`;
}

function errBlock(x, compact) {
  const rows = [];
  if (x.type === "source") rows.push({ kind: "source", o: x.s, name: "素材" });
  if (x.type === "clip") {
    if (x.k.状态 === "需人工") rows.push({ kind: "clip", o: x.k, name: "切片" });
    for (const p of x.errP) rows.push({ kind: "pub", o: p, name: p.平台 });
  }
  return rows.map(r => {
    const opts = resumeOpts(r.kind, r.o);
    const id = r.kind === "pub" ? r.o.publish_id : r.kind === "clip" ? r.o.clip_id : r.o.source_id;
    const why = r.o.原因 || "请查看处理日志";
    const login = r.kind === "pub" && needLogin(r.o) ? `<button class="btn xs pri" onclick="event.stopPropagation();openPlat('${esc(r.o.平台)}','登录')">登录${esc(r.o.平台)}</button>` : "";
    const delBtn = !compact ? `<button class="btn xs bad" onclick="event.stopPropagation();deleteRecord('${r.kind}','${esc(id)}','${esc(x.title)}')">${ic("trash", 12)} 移出 SQLite</button>` : "";
    return `<div class="callout warn" style="margin:6px 0">${rows.length > 1 || r.kind === "pub" ? `<b>${esc(r.name)}：</b>` : ""}${esc(why)}</div><div class="btns">${login}${(compact ? opts.slice(0, 2) : opts).map((o, i) => resumeBtn(r.kind, id, o.to, o.t, i === 0 && !login ? "pri" : "")).join("")}${delBtn}</div>`;
  }).join("");
}

function deleteRecord(kind, id, title) {
  const kindName = { source: "原始录像记录（含其下关联切片）", clip: "切片记录（含其关联发布草稿）", pub: "发布记录" }[kind] || "记录";
  modal(
    "从 SQLite 数据库移除这条记录？",
    `即将移除${kindName}：<b>${esc(title || id)}</b>（<code>${esc(id)}</code>）。<br><br>仅删除本地 <code>data/sop.db</code> 里的数据库条目，硬盘上的原始视频与本地文件会完好保留，绝不删除原片。`,
    "确认移除",
    async () => {
      const ok = await act({ 动作: "删除记录", 对象: kind, id }, "已从 SQLite 移除");
      if (ok && openId === id) closeDrawer();
    },
    true
  );
}

function flash(id) { flashId = id; if (page === "board") render(); setTimeout(() => { flashId = null; }, 2400); }
function togglePick(id, on) { on ? picked.add(id) : picked.delete(id); render(); }

function renderBulk() {
  const b = $("#bulk");
  if (page !== "board" || !picked.size) { b.style.display = "none"; return; }
  b.style.display = "flex";
  b.innerHTML = `<span class="num" style="font-size:13px">已选 <b>${picked.size}</b> 条候选</span>
    <button class="btn sm pri" onclick="bulk('待剪')">${ic("scissors", 14)} 确认剪辑</button>

}
async function bulk(st) {
  const ids = [...picked];
  if (await act({ 动作: "挑片段", 状态: st, items: ids.map(id => ({ id })) }, st === "待剪" ? `已提交 ${ids.length} 条进入剪辑` : `已归档 ${ids.length} 条候选`)) {

    render();
  }
}

/* ================= 二级页面: 流程总览 / 原始录像 / 播放数据 / AI 口味 / 本地目录 ================= */
function overview() {
  const all = items();
  const errN = all.filter(x => x.state === "err").length;
  const activeN = all.filter(x => ["me", "queue", "run", "wait"].includes(x.state)).length;
  const passSources = S.素材.filter(s => s.状态 === "已复盘" && S.切片.some(k => k.source_id === s.source_id)).length;
  const doneN = all.filter(x => x.state === "ok").length + passSources;
  const failN = all.filter(x => x.state === "fail" || x.state === "off").length;
  const stats = [
    { id: "all", k: "全部记录", v: all.filter(x => x.type !== "file").length + passSources },
    { id: "active", k: "进行中 / 待拍板", v: activeN },
    { id: "done", k: "合格 · 已完成", v: doneN },
    { id: "fail", k: "不合格 / 未通过", v: failN, cls: failN ? "fail-hi" : "" },
    { id: "err", k: "需处理 / 异常", v: errN, cls: errN ? "err-hi" : "" }
  ];
  return `
    <div class="page-head">
      <div>
        <h2>流程总览与合格筛选</h2>
        <p>清晰区分合格成品与不合格/未通过录像；剪不好或不需要的记录可直接从本地 SQLite 移除（绝不删原片）。</p>
      </div>
      <div class="btns">
        <button class="btn sm" onclick="openRules('select')">${ic("help", 14)} 查看筛选与剪辑规则</button>
        <button class="btn sm" onclick="reveal('data/sop.db')">${ic("folder", 14)} 在访达中定位 sop.db</button>
      </div>
    </div>

    <div class="ov-stats">
      ${stats.map(st => `
        <button class="ov-stat ${st.cls || ""} ${ovFilter === st.id ? "on" : ""}" onclick="ovFilter='${st.id}';render()">
          <div class="k"><span>${esc(st.k)}</span></div>
          <div class="v">${st.v}</div>
        </button>
      `).join("")}
    </div>

    <div class="feed-bar" style="margin-top:0">
      <div class="dim">当前 SQLite：<code>data/sop.db</code> · 共 ${S.素材.length} 场录像、${S.切片.length} 条切片、${S.发布.length} 条发布</div>
      <div class="search-box">
        <span class="s-ic">${ic("search", 14)}</span>
